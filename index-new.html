<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خريطة بيش وجازان</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css"
  >

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .leaflet-control-layers,
    .leaflet-control-geocoder {
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>

  <script>
    // إنشاء الخريطة
    const map = L.map('map').setView([17.45, 42.55], 9);

    // الخريطة العادية
    const standardMap = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; OpenStreetMap contributors'
      }
    );

    // التضاريس والارتفاعات
    const terrainMap = L.tileLayer(
      'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 17,
        attribution: 'Map data: OpenStreetMap contributors, SRTM | OpenTopoMap'
      }
    );

    // صور الأقمار الصناعية
    const satelliteMap = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Tiles &copy; Esri'
      }
    );

    // عرض الخريطة العادية عند البداية
    standardMap.addTo(map);

    // خيارات الخرائط الثلاثة
    L.control.layers(
      {
        'الخريطة العادية': standardMap,
        'التضاريس والارتفاعات': terrainMap,
        'صور الأقمار الصناعية': satelliteMap
      },
      null,
      {
        collapsed: false
      }
    ).addTo(map);

    // إضافة مربع البحث عن الأماكن
    L.Control.geocoder({
      defaultMarkGeocode: true,
      placeholder: 'ابحث عن مدينة أو مكان...',
      errorMessage: 'لم يتم العثور على المكان'
    }).addTo(map);
  </script>
</body>
</html>
