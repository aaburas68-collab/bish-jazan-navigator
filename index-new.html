<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملاح خرائط بيش وجازان</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Search control -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .gps-panel {
      position: absolute;
      top: 100px;
      right: 10px;
      z-index: 1000;
      background: white;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      width: 190px;
      font-size: 14px;
      line-height: 1.7;
    }

    .gps-panel button {
      width: 100%;
      margin-top: 6px;
      padding: 9px 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    #startGps {
      background: #1677ff;
      color: white;
    }

    #stopGps {
      background: #e53935;
      color: white;
    }

    #gpsStatus {
      margin-top: 7px;
      overflow-wrap: anywhere;
    }

    .leaflet-control-geocoder {
      max-width: calc(100vw - 80px);
    }

    .leaflet-control-geocoder-form input {
      max-width: 190px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="gps-panel">
    <strong>تحديد موقعي</strong>

    <button id="startGps">ابدأ تحديد الموقع</button>
    <button id="stopGps">إيقاف التتبع</button>

    <div id="gpsStatus">لم يبدأ تحديد الموقع بعد.</div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Search control -->
  <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>

  <script>
    // إنشاء الخريطة
    const map = L.map('map', {
      zoomControl: true
    }).setView([17.3, 42.7], 10);

    // الخريطة العادية
    const standardMap = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    );

    // خريطة التضاريس والارتفاعات
    const terrainMap = L.tileLayer(
      'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 17,
        attribution: 'Map data: OpenStreetMap contributors, SRTM | OpenTopoMap'
      }
    );

    // صور الأقمار الصناعية
    // التحديث: منع التكبير لأكثر من المستوى 19
    const satelliteMap = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
      }
    );

    // الطبقة الافتراضية
    standardMap.addTo(map);

    // اختيار نوع الخريطة
    const baseMaps = {
      'الخريطة العادية': standardMap,
      'التضاريس والارتفاعات': terrainMap,
      'صور الأقمار الصناعية': satelliteMap
    };

    L.control.layers(baseMaps, null, {
      collapsed: false
    }).addTo(map);

    // البحث بالعربي والإنجليزي
    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: false,
      placeholder: 'ابحث عن مكان...',
      errorMessage: 'لم يتم العثور على المكان',
      geocoder: L.Control.Geocoder.nominatim({
        geocodingQueryParams: {
          'accept-language': 'ar,en'
        }
      })
    }).addTo(map);

    geocoder.on('markgeocode', function(event) {
      const result = event.geocode;
      const bounds = result.bbox;

      if (bounds) {
        map.fitBounds(bounds);
      } else {
        map.setView(result.center, 16);
      }

      L.marker(result.center)
        .addTo(map)
        .bindPopup(result.name)
        .openPopup();
    });

    // متغيرات تحديد الموقع
    let gpsWatchId = null;
    let gpsMarker = null;
    let accuracyCircle = null;
    let bestAccuracy = Infinity;

    const gpsStatus = document.getElementById('gpsStatus');
    const startGpsButton = document.getElementById('startGps');
    const stopGpsButton = document.getElementById('stopGps');

    // بدء تحديد الموقع المباشر
    startGpsButton.addEventListener('click', function() {
      if (!('geolocation' in navigator)) {
        gpsStatus.textContent = 'جهازك لا يدعم تحديد الموقع.';
        return;
      }

      if (gpsWatchId !== null) {
        gpsStatus.textContent = 'تحديد الموقع يعمل بالفعل.';
        return;
      }

      gpsStatus.textContent = 'جارٍ تحديد موقعك...';

      gpsWatchId = navigator.geolocation.watchPosition(
        function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          const currentLocation = [latitude, longitude];

          if (accuracy < bestAccuracy) {
            bestAccuracy = accuracy;
          }

          if (!gpsMarker) {
            gpsMarker = L.marker(currentLocation).addTo(map);
          } else {
            gpsMarker.setLatLng(currentLocation);
          }

          gpsMarker.bindPopup(
            'أنت هنا<br>' +
            'دقة الموقع الحالية: ' + Math.round(accuracy) + ' متر'
          );

          if (!accuracyCircle) {
            accuracyCircle = L.circle(currentLocation, {
              radius: accuracy,
              color: '#1677ff',
              fillColor: '#1677ff',
              fillOpacity: 0.15,
              weight: 2
            }).addTo(map);
          } else {
            accuracyCircle.setLatLng(currentLocation);
            accuracyCircle.setRadius(accuracy);
          }

          map.setView(currentLocation, Math.max(map.getZoom(), 17));

          gpsStatus.innerHTML =
            'أنت هنا<br>' +
            'دقة الموقع الحالية: ' + Math.round(accuracy) + ' متر<br>' +
            'أفضل دقة وصلت إليها: ' + Math.round(bestAccuracy) + ' متر';
        },
        function(error) {
          let message = 'تعذر تحديد الموقع.';

          if (error.code === 1) {
            message = 'تم رفض إذن الموقع. اسمح للصفحة باستخدام موقعك.';
          } else if (error.code === 2) {
            message = 'موقعك غير متاح حاليًا. حاول مرة أخرى.';
          } else if (error.code === 3) {
            message = 'انتهت مهلة تحديد الموقع. حاول مرة أخرى.';
          }

          gpsStatus.textContent = message;

          if (gpsWatchId !== null) {
            navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = null;
          }
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 30000
        }
      );
    });

    // إيقاف التتبع المباشر
    stopGpsButton.addEventListener('click', function() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        gpsStatus.textContent = 'تم إيقاف التتبع.';
      } else {
        gpsStatus.textContent = 'التتبع متوقف بالفعل.';
      }
    });
  </script>
</body>
</html>
