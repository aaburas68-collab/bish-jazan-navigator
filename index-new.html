<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملاح خرائط بيش وجازان</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* لوحة الموقع: أصغر ولا تحجب مساحة كبيرة من الخريطة */
    .gps-panel {
      position: absolute;
      top: 115px;
      right: 10px;
      z-index: 1000;
      width: 155px;
      box-sizing: border-box;
      padding: 9px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
      font-size: 12px;
    }

    .gps-heading {
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 13px;
      text-align: center;
    }

    .gps-panel button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 5px;
      padding: 8px 5px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    #startGps {
      background: #1677ff;
      color: white;
    }

    #stopGps {
      background: #e53935;
      color: white;
    }

    #gpsStatus {
      margin-top: 7px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .leaflet-control-geocoder {
      max-width: calc(100vw - 80px);
    }

    .leaflet-control-geocoder-form input {
      max-width: 180px;
    }

    @media (max-width: 480px) {
      .gps-panel {
        top: 105px;
        right: 8px;
        width: 145px;
        padding: 7px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="gps-panel">
    <div class="gps-heading">📍 موقعي</div>

    <button id="startGps">تحديد موقعي</button>
    <button id="stopGps">إيقاف التتبع</button>

    <div id="gpsStatus">اضغط لتحديد موقعك.</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>

  <script>
    // إنشاء الخريطة
    const map = L.map('map').setView([17.3, 42.7], 10);

    // الخريطة العادية
    const standardMap = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    );

    // التضاريس والارتفاعات
    const terrainMap = L.tileLayer(
      'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 17,
        attribution: 'Map data: OpenStreetMap contributors, SRTM | OpenTopoMap'
      }
    );

    // صور الأقمار الصناعية
    const satelliteMap = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
      }
    );

    standardMap.addTo(map);

    // اختيار نوع الخريطة
    L.control.layers({
      'الخريطة العادية': standardMap,
      'التضاريس والارتفاعات': terrainMap,
      'صور الأقمار الصناعية': satelliteMap
    }, null, {
      collapsed: false
    }).addTo(map);

    // البحث بالعربي والإنجليزي
    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: false,
      placeholder: 'ابحث عن مكان...',
      errorMessage: 'لم يتم العثور على المكان',
      geocoder: L.Control.Geocoder.nominatim({
        geocodingQueryParams: {
          'accept-language': 'ar,en'
        }
      })
    }).addTo(map);

    let searchMarker = null;

    geocoder.on('markgeocode', function(event) {
      const result = event.geocode;
      const bounds = result.bbox;

      if (bounds) {
        map.fitBounds(bounds);
      } else {
        map.setView(result.center, 16);
      }

      if (searchMarker) {
        map.removeLayer(searchMarker);
      }

      searchMarker = L.marker(result.center)
        .addTo(map)
        .bindPopup(result.name)
        .openPopup();
    });

    // متغيرات GPS
    let gpsWatchId = null;
    let gpsMarker = null;
    let accuracyCircle = null;
    let currentLocation = null;
    let bestAccuracy = Infinity;
    let firstFixPending = false;

    const gpsStatus = document.getElementById('gpsStatus');
    const startGpsButton = document.getElementById('startGps');
    const stopGpsButton = document.getElementById('stopGps');

    // تحديد الموقع أو الرجوع إليه عند الضغط مرة أخرى
    startGpsButton.addEventListener('click', function() {
      if (!('geolocation' in navigator)) {
        gpsStatus.textContent = 'جهازك لا يدعم تحديد الموقع.';
        return;
      }

      // إذا كان التتبع يعمل، أعد الخريطة لموقعك عند طلبك فقط
      if (gpsWatchId !== null) {
        if (currentLocation) {
          map.setView(currentLocation, Math.max(map.getZoom(), 17));
          gpsMarker.openPopup();
        } else {
          gpsStatus.textContent = 'جارٍ الحصول على موقعك...';
        }
        return;
      }

      firstFixPending = true;
      bestAccuracy = Infinity;
      gpsStatus.textContent = 'جارٍ تحديد موقعك...';

      gpsWatchId = navigator.geolocation.watchPosition(
        function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          currentLocation = [latitude, longitude];

          if (accuracy < bestAccuracy) {
            bestAccuracy = accuracy;
          }

          // إنشاء علامة الموقع أو تحديثها
          if (!gpsMarker) {
            gpsMarker = L.marker(currentLocation).addTo(map);
          } else {
            gpsMarker.setLatLng(currentLocation);
          }

          gpsMarker.bindPopup(
            'أنت هنا<br>' +
            'دقة الموقع الحالية: ' + Math.round(accuracy) + ' متر'
          );

          // إنشاء دائرة دقة الموقع أو تحديثها
          if (!accuracyCircle) {
            accuracyCircle = L.circle(currentLocation, {
              radius: accuracy,
              color: '#1677ff',
              fillColor: '#1677ff',
              fillOpacity: 0.15,
              weight: 2
            }).addTo(map);
          } else {
            accuracyCircle.setLatLng(currentLocation);
            accuracyCircle.setRadius(accuracy);
          }

          // تحريك الخريطة مرة واحدة فقط عند الحصول على أول موقع
          // لا تعيد الخريطة تلقائيًا أثناء استكشاف الأماكن
          if (firstFixPending) {
            map.setView(currentLocation, 17);
            firstFixPending = false;
          }

          gpsStatus.innerHTML =
            'دقة الموقع: ' + Math.round(accuracy) + ' متر<br>' +
            'أفضل دقة: ' + Math.round(bestAccuracy) + ' متر<br>' +
            'التتبع يعمل';
        },
        function(error) {
          let message = 'تعذر تحديد الموقع.';

          if (error.code === 1) {
            message = 'اسمح للصفحة باستخدام موقعك من إعدادات المتصفح.';
          } else if (error.code === 2) {
            message = 'الموقع غير متاح حاليًا. حاول مرة أخرى.';
          } else if (error.code === 3) {
            message = 'انتهت مهلة تحديد الموقع. حاول مرة أخرى.';
          }

          gpsStatus.textContent = message;

          if (gpsWatchId !== null) {
            navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = null;
          }

          firstFixPending = false;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 30000
        }
      );
    });

    // إيقاف التتبع
    stopGpsButton.addEventListener('click', function() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        firstFixPending = false;
        gpsStatus.textContent = 'تم إيقاف التتبع.';
      } else {
        gpsStatus.textContent = 'التتبع متوقف بالفعل.';
      }
    });
  </script>
</body>
</html>
