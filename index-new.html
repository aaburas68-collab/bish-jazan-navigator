<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خريطة بيش وجازان</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .leaflet-control-layers {
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // إنشاء الخريطة وتحديد موقع البداية
    const map = L.map('map').setView([17.45, 42.55], 9);

    // الخيار الأول: الخريطة العادية
    const standardMap = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; OpenStreetMap contributors'
      }
    );

    // الخيار الثاني: التضاريس والارتفاعات
    const terrainMap = L.tileLayer(
      'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 17,
        attribution:
          'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: OpenTopoMap'
      }
    );

    // الخيار الثالث: صور الأقمار الصناعية
    const satelliteMap = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Tiles &copy; Esri'
      }
    );

    // تشغيل الخريطة العادية عند فتح الموقع
    standardMap.addTo(map);

    // إظهار الخيارات الثلاثة في مربع واحد
    L.control.layers(
      {
        'الخريطة العادية': standardMap,
        'التضاريس والارتفاعات': terrainMap,
        'صور الأقمار الصناعية': satelliteMap
      },
      null,
      {
        collapsed: false
      }
    ).addTo(map);
  </script>
</body>
</html>
