<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملاح خرائط بيش وجازان</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css">

  <style>
    :root {
      --panel-bg: #e7edf3;
      --panel-border: #aab8c6;
      --panel-text: #243447;
      --accent: #2463a6;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* البحث */
    .leaflet-control-geocoder {
      max-width: calc(100vw - 80px);
      margin-top: 8px !important;
      margin-right: 8px !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 9px !important;
      background: var(--panel-bg) !important;
      box-shadow: 0 2px 7px rgba(20, 35, 50, 0.25) !important;
      overflow: hidden;
    }

    .leaflet-control-geocoder-form input {
      width: 170px;
      max-width: calc(100vw - 125px);
      box-sizing: border-box;
      padding: 9px 10px;
      color: var(--panel-text) !important;
      background: var(--panel-bg) !important;
      border: none !important;
      font-family: Arial, sans-serif;
      font-size: 13px;
      outline: none;
    }

    .leaflet-control-geocoder-form input::placeholder {
      color: #526477;
      opacity: 1;
    }

    .leaflet-control-geocoder-icon {
      background-color: var(--panel-bg) !important;
      border: none !important;
    }

    .leaflet-control-geocoder a {
      color: var(--panel-text) !important;
    }

    .leaflet-control-geocoder-alternatives {
      max-width: calc(100vw - 100px);
      max-height: 45vh;
      overflow-y: auto;
      background: var(--panel-bg) !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 8px !important;
      box-shadow: 0 2px 7px rgba(20, 35, 50, 0.25) !important;
    }

    .leaflet-control-geocoder-alternatives a {
      color: var(--panel-text) !important;
    }

    /* صندوق اختيار أنواع الخرائط */
    .leaflet-control-layers {
      margin-top: 5px !important;
      margin-right: 8px !important;
      padding: 7px 9px !important;
      color: var(--panel-text) !important;
      background: var(--panel-bg) !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 9px !important;
      box-shadow: 0 2px 7px rgba(20, 35, 50, 0.25) !important;
      font-size: 12px;
    }

    .leaflet-control-layers-list {
      margin: 0;
    }

    .leaflet-control-layers label {
      margin: 5px 0;
      color: var(--panel-text);
      font-size: 12px;
    }

    .leaflet-control-layers-toggle {
      width: 34px !important;
      height: 34px !important;
      background-color: var(--panel-bg) !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 8px !important;
    }

    /* أزرار الزوم على اليسار */
    .leaflet-control-zoom {
      margin-top: 8px !important;
      margin-left: 8px !important;
      border: none !important;
      box-shadow: none !important;
    }

    .leaflet-control-zoom a {
      width: 34px !important;
      height: 34px !important;
      line-height: 32px !important;
      margin-bottom: 5px;
      color: var(--panel-text) !important;
      background: var(--panel-bg) !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 8px !important;
      box-shadow: 0 2px 7px rgba(20, 35, 50, 0.25) !important;
    }

    /* لوحة موقعي */
    .gps-panel {
      position: absolute;
      top: 175px;
      right: 8px;
      z-index: 1000;
      width: 112px;
      box-sizing: border-box;
      padding: 7px;
      color: var(--panel-text);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 9px;
      box-shadow: 0 2px 7px rgba(20, 35, 50, 0.25);
      font-size: 11px;
    }

    .gps-heading {
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 12px;
      text-align: center;
    }

    .gps-panel button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 5px;
      padding: 7px 3px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      line-height: 1.3;
      cursor: pointer;
    }

    #startGps {
      background: var(--accent);
      color: #ffffff;
    }

    #stopGps {
      background: #a83d46;
      color: #ffffff;
    }

    #gpsStatus {
      margin-top: 6px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      text-align: center;
      color: var(--panel-text);
    }

    @media (max-width: 480px) {
      .leaflet-control-geocoder {
        margin-top: 6px !important;
        margin-right: 5px !important;
        max-width: calc(100vw - 80px);
      }

      .leaflet-control-geocoder-form input {
        width: 145px;
        font-size: 12px;
      }

      .leaflet-control-layers {
        margin-right: 5px !important;
        font-size: 11px;
      }

      .leaflet-control-layers label {
        font-size: 11px;
      }

      .leaflet-control-zoom {
        margin-top: 6px !important;
        margin-left: 5px !important;
      }

      .gps-panel {
        top: 175px;
        right: 5px;
        width: 104px;
        padding: 6px;
      }

      .gps-panel button {
        padding: 7px 2px;
        font-size: 10px;
      }

      .gps-heading {
        font-size: 11px;
      }

      #gpsStatus {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="gps-panel">
    <div class="gps-heading">📍 موقعي</div>
    <button id="startGps">تحديد موقعي</button>
    <button id="stopGps">إيقاف التتبع</button>
    <div id="gpsStatus">اضغط لتحديد موقعك.</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>

  <script>
    // إنشاء الخريطة
    const map = L.map('map').setView([17.3, 42.7], 10);

    // الخريطة العادية
    const standardMap = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    );

    // التضاريس والارتفاعات
    const terrainMap = L.tileLayer(
      'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 17,
        attribution: 'Map data: OpenStreetMap contributors, SRTM | OpenTopoMap'
      }
    );

    // صور الأقمار الصناعية
    const satelliteMap = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        maxZoom: 22,
        maxNativeZoom: 19,
        attribution: 'Tiles &copy; Esri'
      }
    );

    standardMap.addTo(map);

    // اختيار نوع الخريطة
    L.control.layers({
      'الخريطة العادية': standardMap,
      'التضاريس والارتفاعات': terrainMap,
      'صور الأقمار الصناعية': satelliteMap
    }, null, {
      collapsed: false,
      position: 'topright'
    }).addTo(map);

    // البحث بالعربي والإنجليزي
    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: false,
      position: 'topright',
      placeholder: 'ابحث عن مكان...',
      errorMessage: 'لم يتم العثور على المكان',
      geocoder: L.Control.Geocoder.nominatim({
        geocodingQueryParams: {
          'accept-language': 'ar,en'
        }
      })
    }).addTo(map);

    let searchMarker = null;

    geocoder.on('markgeocode', function(event) {
      const result = event.geocode;

      if (result.bbox) {
        map.fitBounds(result.bbox);
      } else {
        map.setView(result.center, 16);
      }

      if (searchMarker) {
        map.removeLayer(searchMarker);
      }

      searchMarker = L.marker(result.center)
        .addTo(map)
        .bindPopup(result.name)
        .openPopup();
    });

    // متغيرات التتبع
    let gpsWatchId = null;
    let gpsMarker = null;
    let accuracyCircle = null;
    let currentLocation = null;
    let bestAccuracy = Infinity;
    let firstFixPending = false;

    const gpsStatus = document.getElementById('gpsStatus');
    const startGpsButton = document.getElementById('startGps');
    const stopGpsButton = document.getElementById('stopGps');

    // تحديد الموقع أو الرجوع إليه عند الضغط
    startGpsButton.addEventListener('click', function() {
      if (!navigator.geolocation) {
        gpsStatus.textContent = 'جهازك لا يدعم تحديد الموقع.';
        return;
      }

      if (gpsWatchId !== null) {
        if (currentLocation) {
          map.setView(currentLocation, Math.max(map.getZoom(), 17));

          if (gpsMarker) {
            gpsMarker.openPopup();
          }
        } else {
          gpsStatus.textContent = 'جارٍ الحصول على موقعك...';
        }
        return;
      }

      firstFixPending = true;
      bestAccuracy = Infinity;
      gpsStatus.textContent = 'جارٍ تحديد موقعك...';

      gpsWatchId = navigator.geolocation.watchPosition(
        function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          currentLocation = [latitude, longitude];

          if (accuracy < bestAccuracy) {
            bestAccuracy = accuracy;
          }

          // تحديث علامة الموقع
          if (!gpsMarker) {
            gpsMarker = L.marker(currentLocation).addTo(map);
          } else {
            gpsMarker.setLatLng(currentLocation);
          }

          gpsMarker.bindPopup(
            'أنت هنا<br>' +
            'دقة الموقع الحالية: ' +
            Math.round(accuracy) + ' متر'
          );

          // تحديث دائرة الدقة
          if (!accuracyCircle) {
            accuracyCircle = L.circle(currentLocation, {
              radius: accuracy,
              color: '#1677ff',
              fillColor: '#1677ff',
              fillOpacity: 0.15,
              weight: 2
            }).addTo(map);
          } else {
            accuracyCircle.setLatLng(currentLocation);
            accuracyCircle.setRadius(accuracy);
          }

          // تحريك الخريطة عند أول تحديد فقط
          if (firstFixPending) {
            map.setView(currentLocation, 17);
            firstFixPending = false;
          }

          gpsStatus.innerHTML =
            'الدقة: ' + Math.round(accuracy) + ' م<br>' +
            'أفضل دقة: ' + Math.round(bestAccuracy) + ' م<br>' +
            'التتبع يعمل';
        },
        function(error) {
          let message = 'تعذر تحديد الموقع.';

          if (error.code === 1) {
            message = 'اسمح للصفحة بالوصول إلى موقعك.';
          } else if (error.code === 2) {
            message = 'الموقع غير متاح حاليًا.';
          } else if (error.code === 3) {
            message = 'انتهت مهلة تحديد الموقع.';
          }

          gpsStatus.textContent = message;

          if (gpsWatchId !== null) {
            navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = null;
          }

          firstFixPending = false;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 30000
        }
      );
    });

    // إيقاف التتبع
    stopGpsButton.addEventListener('click', function() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        firstFixPending = false;
        gpsStatus.textContent = 'تم إيقاف التتبع.';
      } else {
        gpsStatus.textContent = 'التتبع متوقف.';
      }
    });
  </script>
</body>
</html>
