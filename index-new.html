<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملاح خرائط بيش وجازان</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css">

  <style>
    :root {
      --panel-bg: #ffffff;
      --panel-border: #d6dbe1;
      --panel-text: #263442;
      --shadow: 0 2px 7px rgba(25, 40, 55, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    /* تخطيط الصفحة: الخريطة بالأعلى والأدوات أسفلها */
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #fff;
    }

    #map {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      position: relative;
      background: #e9edf0;
    }

    /* شريط الأدوات السفلي */
    #bottom-panel {
      flex: 0 0 auto;
      width: 100%;
      padding: 8px 10px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid var(--panel-border);
      box-shadow: 0 -2px 8px rgba(20, 30, 40, 0.07);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: visible;
    }

    /* لوحة الموقع تأتي أولًا تحت الخريطة */
    .gps-panel {
      width: 100%;
      padding: 8px;
      color: var(--panel-text);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .gps-heading {
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 7px;
    }

    .gps-actions {
      display: flex;
      gap: 7px;
    }

    .gps-panel button {
      flex: 1;
      min-width: 0;
      padding: 9px 5px;
      border: none;
      border-radius: 7px;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.4;
      cursor: pointer;
    }

    #startGps {
      background: #2469a8;
      color: #fff;
    }

    #stopGps {
      background: #b4474d;
      color: #fff;
    }

    #gpsStatus {
      margin-top: 7px;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
    }

    /* البحث يأتي تحت لوحة الموقع */
    #search-panel {
      position: relative;
      width: 100%;
      z-index: 3000;
      background: #fff;
      border: 1px solid var(--panel-border);
      border-radius: 9px;
      box-shadow: var(--shadow);
    }

    #search-host {
      width: 100%;
      position: relative;
    }

    #search-host .leaflet-control-geocoder {
      width: 100%;
      max-width: none;
      margin: 0 !important;
      float: none;
      position: relative;
      background: #fff !important;
      border: none !important;
      border-radius: 9px !important;
      box-shadow: none !important;
      overflow: visible;
    }

    #search-host .leaflet-control-geocoder-form {
      width: 100%;
      display: flex;
      align-items: center;
    }

    #search-host .leaflet-control-geocoder-form input {
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 9px 12px;
      color: var(--panel-text) !important;
      background: #fff !important;
      border: none !important;
      outline: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    #search-host .leaflet-control-geocoder-form input::placeholder {
      color: #66717d;
      opacity: 1;
    }

    #search-host .leaflet-control-geocoder-icon {
      flex: 0 0 38px;
      height: 38px;
      background-color: #fff !important;
      border: none !important;
    }

    #search-host .leaflet-control-geocoder a {
      color: var(--panel-text) !important;
    }

    /* نتائج البحث تظهر فوق لوحة الأدوات ولا تغطي الخريطة */
    #search-host .leaflet-control-geocoder-alternatives {
      position: absolute !important;
      left: 0 !important;
      right: 0 !important;
      bottom: calc(100% + 5px) !important;
      top: auto !important;
      width: 100% !important;
      max-width: 100% !important;
      max-height: min(38vh, 280px);
      overflow-y: auto;
      overscroll-behavior: contain;
      background: #fff !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 9px !important;
      box-shadow: 0 4px 16px rgba(20, 30, 40, 0.18) !important;
      z-index: 5000 !important;
    }

    #search-host .leaflet-control-geocoder-alternatives a {
      display: block;
      padding: 10px 12px;
      color: var(--panel-text) !important;
      background: #fff;
      border-bottom: 1px solid #edf0f2;
      line-height: 1.5;
      white-space: normal;
    }

    #search-host .leaflet-control-geocoder-alternatives a:hover {
      background: #f2f6fa;
    }

    #search-host .leaflet-control-geocoder-alternatives li:last-child a {
      border-bottom: none;
    }

    /* أدوات الخريطة داخل مساحة الخريطة فقط */
    #map .leaflet-top.leaflet-right {
      top: 7px;
      right: 7px;
      left: auto;
    }

    #map .leaflet-top.leaflet-right .leaflet-control {
      margin: 0 0 6px 0 !important;
      float: none;
    }

    /* صندوق اختيار نوع الخريطة */
    #map .leaflet-control-layers {
      padding: 6px 8px !important;
      color: var(--panel-text) !important;
      background: #fff !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 8px !important;
      box-shadow: var(--shadow) !important;
      font-size: 12px;
    }

    #map .leaflet-control-layers-list {
      margin: 0;
    }

    #map .leaflet-control-layers label {
      margin: 4px 0;
      color: var(--panel-text);
      font-size: 12px;
    }

    #map .leaflet-control-layers-toggle {
      width: 34px !important;
      height: 34px !important;
      background-color: #fff !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 7px !important;
    }

    /* أزرار التكبير والتصغير في اليسار */
    #map .leaflet-top.leaflet-left {
      left: 7px;
    }

    #map .leaflet-control-zoom {
      margin-top: 7px !important;
      margin-left: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }

    #map .leaflet-control-zoom a {
      width: 35px !important;
      height: 35px !important;
      line-height: 33px !important;
      margin-bottom: 5px;
      color: var(--panel-text) !important;
      background: #fff !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 8px !important;
      box-shadow: var(--shadow) !important;
    }

    @media (max-width: 480px) {
      #bottom-panel {
        padding: 7px;
        padding-bottom: max(7px, env(safe-area-inset-bottom));
        gap: 7px;
      }

      .gps-panel {
        padding: 7px;
      }

      .gps-panel button {
        padding: 9px 3px;
        font-size: 11px;
      }

      .gps-heading {
        font-size: 12px;
      }

      #gpsStatus {
        font-size: 10px;
      }

      #search-host .leaflet-control-geocoder-form input {
        height: 40px;
        font-size: 13px;
      }

      #search-host .leaflet-control-geocoder-alternatives {
        max-height: 32vh;
      }

      #map .leaflet-top.leaflet-right {
        top: 5px;
        right: 5px;
      }

      #map .leaflet-top.leaflet-left {
        left: 5px;
      }

      #map .leaflet-control-layers {
        font-size: 11px;
      }

      #map .leaflet-control-layers label {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="map"></div>

    <section id="bottom-panel" aria-label="أدوات الموقع والبحث">
      <div class="gps-panel">
        <div class="gps-heading">📍 موقعي</div>

        <div class="gps-actions">
          <button id="startGps" type="button">تحديد موقعي</button>
          <button id="stopGps" type="button">إيقاف التتبع</button>
        </div>

        <div id="gpsStatus" aria-live="polite">اضغط لتحديد موقعك.</div>
      </div>

      <div id="search-panel">
        <div id="search-host"></div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>

  <script>
    const map = L.map('map', {
      zoomControl: false
    }).setView([17.3, 42.7], 10);

    // الخريطة العادية
    const standardMap = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    );

    // التضاريس والارتفاعات
    const terrainMap = L.tileLayer(
      'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 17,
        attribution: 'Map data: OpenStreetMap contributors, SRTM | OpenTopoMap'
      }
    );

    // صور الأقمار الصناعية
    const satelliteMap = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        maxZoom: 22,
        maxNativeZoom: 19,
        attribution: 'Tiles &copy; Esri'
      }
    );

    standardMap.addTo(map);

    // اختيار نوع الخريطة
    const layersControl = L.control.layers({
      'الخريطة العادية': standardMap,
      'التضاريس والارتفاعات': terrainMap,
      'صور الأقمار الصناعية': satelliteMap
    }, null, {
      collapsed: false,
      position: 'topright'
    }).addTo(map);

    // أزرار التكبير والتصغير في اليسار
    L.control.zoom({
      position: 'topleft'
    }).addTo(map);

    // البحث بالعربي والإنجليزي
    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: false,
      position: 'topright',
      placeholder: 'ابحث عن مكان بالعربي أو الإنجليزي...',
      errorMessage: 'لم يتم العثور على المكان',
      geocoder: L.Control.Geocoder.nominatim({
        geocodingQueryParams: {
          'accept-language': 'ar,en'
        }
      })
    }).addTo(map);

    /*
      ننقل عنصر البحث إلى الشريط السفلي.
      يبقى البحث تابعًا لـ Leaflet وتظل أحداثه فعالة.
    */
    const searchHost = document.getElementById('search-host');
    searchHost.appendChild(geocoder.getContainer());

    let searchMarker = null;

    geocoder.on('markgeocode', function(event) {
      const result = event.geocode;

      if (result.bbox) {
        map.fitBounds(result.bbox, {
          padding: [30, 30],
          maxZoom: 17
        });
      } else {
        map.setView(result.center, 16);
      }

      if (searchMarker) {
        map.removeLayer(searchMarker);
      }

      searchMarker = L.marker(result.center)
        .addTo(map)
        .bindPopup(result.name)
        .openPopup();
    });

    // متغيرات تحديد الموقع
    let gpsWatchId = null;
    let gpsMarker = null;
    let accuracyCircle = null;
    let currentLocation = null;
    let bestAccuracy = Infinity;
    let firstFixPending = false;

    const gpsStatus = document.getElementById('gpsStatus');
    const startGpsButton = document.getElementById('startGps');
    const stopGpsButton = document.getElementById('stopGps');

    // تحديد الموقع أو الرجوع إلى الموقع الحالي
    startGpsButton.addEventListener('click', function() {
      if (!navigator.geolocation) {
        gpsStatus.textContent = 'جهازك لا يدعم تحديد الموقع.';
        return;
      }

      if (gpsWatchId !== null) {
        if (currentLocation) {
          map.setView(currentLocation, Math.max(map.getZoom(), 17));

          if (gpsMarker) {
            gpsMarker.openPopup();
          }
        } else {
          gpsStatus.textContent = 'جارٍ الحصول على موقعك...';
        }
        return;
      }

      firstFixPending = true;
      bestAccuracy = Infinity;
      gpsStatus.textContent = 'جارٍ تحديد موقعك...';

      gpsWatchId = navigator.geolocation.watchPosition(
        function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          currentLocation = [latitude, longitude];

          if (accuracy < bestAccuracy) {
            bestAccuracy = accuracy;
          }

          // تحديث علامة الموقع
          if (!gpsMarker) {
            gpsMarker = L.marker(currentLocation).addTo(map);
          } else {
            gpsMarker.setLatLng(currentLocation);
          }

          gpsMarker.bindPopup(
            'أنت هنا<br>' +
            'دقة الموقع الحالية: ' +
            Math.round(accuracy) + ' متر'
          );

          // تحديث دائرة الدقة
          if (!accuracyCircle) {
            accuracyCircle = L.circle(currentLocation, {
              radius: accuracy,
              color: '#1677ff',
              fillColor: '#1677ff',
              fillOpacity: 0.15,
              weight: 2
            }).addTo(map);
          } else {
            accuracyCircle.setLatLng(currentLocation);
            accuracyCircle.setRadius(accuracy);
          }

          // تحريك الخريطة عند أول قراءة فقط
          if (firstFixPending) {
            map.setView(currentLocation, 17);
            firstFixPending = false;
          }

          gpsStatus.innerHTML =
            'الدقة الحالية: ' + Math.round(accuracy) + ' متر<br>' +
            'أفضل دقة: ' + Math.round(bestAccuracy) + ' متر<br>' +
            'التتبع يعمل';
        },
        function(error) {
          let message = 'تعذر تحديد الموقع.';

          if (error.code === 1) {
            message = 'اسمح للصفحة بالوصول إلى موقعك.';
          } else if (error.code === 2) {
            message = 'الموقع غير متاح حاليًا.';
          } else if (error.code === 3) {
            message = 'انتهت مهلة تحديد الموقع.';
          }

          gpsStatus.textContent = message;

          if (gpsWatchId !== null) {
            navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = null;
          }

          firstFixPending = false;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 30000
        }
      );
    });

    // إيقاف التتبع مع إبقاء آخر موقع ظاهرًا
    stopGpsButton.addEventListener('click', function() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        firstFixPending = false;
        gpsStatus.textContent = 'تم إيقاف التتبع.';
      } else {
        gpsStatus.textContent = 'التتبع متوقف.';
      }
    });

    // تحديث حجم الخريطة بعد ظهور تخطيط الصفحة
    function refreshMapSize() {
      requestAnimationFrame(function() {
        map.invalidateSize();
      });
    }

    window.addEventListener('resize', refreshMapSize);
    window.addEventListener('orientationchange', function() {
      setTimeout(refreshMapSize, 250);
    });

    map.whenReady(function() {
      setTimeout(refreshMapSize, 100);
    });
  </script>
</body>
</html>
