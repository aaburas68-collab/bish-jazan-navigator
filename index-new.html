<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملاح خرائط بيش وجازان</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css">

  <style>
    :root {
      --panel-bg: #fff;
      --panel-border: #d6dbe1;
      --panel-text: #263442;
      --shadow: 0 2px 6px rgba(25, 40, 55, 0.16);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .leaflet-top.leaflet-right {
      top: 7px;
      right: 7px;
      left: auto;
    }

    .leaflet-top.leaflet-right .leaflet-control {
      margin: 0 0 6px 0 !important;
      float: none;
    }

    /* مربع البحث */
    .leaflet-control-geocoder {
      width: max-content;
      max-width: calc(100vw - 90px);
      background: var(--panel-bg) !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 8px !important;
      box-shadow: var(--shadow) !important;
      overflow: visible !important;
    }

    .leaflet-control-geocoder-form input {
      width: 170px;
      max-width: calc(100vw - 125px);
      box-sizing: border-box;
      padding: 8px 9px;
      color: var(--panel-text) !important;
      background: #fff !important;
      border: none !important;
      outline: none;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    .leaflet-control-geocoder-form input::placeholder {
      color: #596673;
      opacity: 1;
    }

    .leaflet-control-geocoder-icon {
      background-color: #fff !important;
      border: none !important;
    }

    .leaflet-control-geocoder a {
      color: var(--panel-text) !important;
    }

    /* نتائج البحث فوق صندوق البحث حتى لا يحجبها صندوق موقعي */
    .leaflet-control-geocoder .leaflet-control-geocoder-alternatives {
      position: absolute !important;
      top: auto !important;
      bottom: calc(100% + 5px) !important;
      right: 0 !important;
      left: auto !important;
      width: max-content;
      min-width: 100%;
      max-width: calc(100vw - 100px);
      max-height: 40vh;
      overflow-y: auto;
      z-index: 2000 !important;
      background: #fff !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 8px !important;
      box-shadow: var(--shadow) !important;
    }

    .leaflet-control-geocoder-alternatives a {
      color: var(--panel-text) !important;
      white-space: normal;
      line-height: 1.5;
    }

    /* الطبقات */
    .leaflet-control-layers {
      padding: 6px 8px !important;
      color: var(--panel-text) !important;
      background: #fff !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 8px !important;
      box-shadow: var(--shadow) !important;
      font-size: 12px;
    }

    .leaflet-control-layers-list {
      margin: 0;
    }

    .leaflet-control-layers label {
      margin: 4px 0;
      color: var(--panel-text);
      font-size: 12px;
    }

    .leaflet-control-layers-toggle {
      width: 32px !important;
      height: 32px !important;
      background-color: #fff !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 7px !important;
    }

    /* صندوق موقعي */
    .gps-panel {
      position: absolute;
      top: 0;
      right: 7px;
      z-index: 1000;
      width: 112px;
      box-sizing: border-box;
      padding: 6px;
      color: var(--panel-text);
      background: #fff;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      font-size: 11px;
    }

    .gps-heading {
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }

    .gps-panel button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      padding: 7px 3px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      line-height: 1.3;
      cursor: pointer;
    }

    #startGps {
      background: #2469a8;
      color: #fff;
    }

    #stopGps {
      background: #b4474d;
      color: #fff;
    }

    #gpsStatus {
      margin-top: 5px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      text-align: center;
    }

    /* التكبير والتصغير يسار الخريطة */
    .leaflet-top.leaflet-left {
      left: 7px;
    }

    .leaflet-control-zoom {
      margin-top: 7px !important;
      margin-left: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }

    .leaflet-control-zoom a {
      width: 33px !important;
      height: 33px !important;
      line-height: 31px !important;
      margin-bottom: 5px;
      color: var(--panel-text) !important;
      background: #fff !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 8px !important;
      box-shadow: var(--shadow) !important;
    }

    @media (max-width: 480px) {
      .leaflet-top.leaflet-right {
        top: 5px;
        right: 5px;
      }

      .leaflet-control-geocoder-form input {
        width: 145px;
        font-size: 12px;
      }

      .leaflet-control-layers,
      .leaflet-control-layers label {
        font-size: 11px;
      }

      .gps-panel {
        width: 104px;
        padding: 5px;
        font-size: 10px;
      }

      .gps-panel button {
        padding: 7px 2px;
        font-size: 10px;
      }

      .gps-heading {
        font-size: 11px;
      }

      #gpsStatus {
        font-size: 10px;
      }

      .leaflet-top.leaflet-left {
        left: 5px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>

  <script>
    const map = L.map('map').setView([17.3, 42.7], 10);

    // الخريطة العادية
    const standardMap = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    );

    // التضاريس والارتفاعات
    const terrainMap = L.tileLayer(
      'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 17,
        attribution: 'Map data: OpenStreetMap contributors, SRTM | OpenTopoMap'
      }
    );

    // صور الأقمار الصناعية
    const satelliteMap = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        maxZoom: 22,
        maxNativeZoom: 19,
        attribution: 'Tiles &copy; Esri'
      }
    );

    standardMap.addTo(map);

    // اختيار نوع الخريطة
    const layersControl = L.control.layers({
      'الخريطة العادية': standardMap,
      'التضاريس والارتفاعات': terrainMap,
      'صور الأقمار الصناعية': satelliteMap
    }, null, {
      collapsed: false,
      position: 'topright'
    }).addTo(map);

    // البحث بالعربي والإنجليزي
    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: false,
      position: 'topright',
      placeholder: 'ابحث عن مكان...',
      errorMessage: 'لم يتم العثور على المكان',
      geocoder: L.Control.Geocoder.nominatim({
        geocodingQueryParams: {
          'accept-language': 'ar,en'
        }
      })
    }).addTo(map);

    let searchMarker = null;

    geocoder.on('markgeocode', function(event) {
      const result = event.geocode;

      if (result.bbox) {
        map.fitBounds(result.bbox);
      } else {
        map.setView(result.center, 16);
      }

      if (searchMarker) {
        map.removeLayer(searchMarker);
      }

      searchMarker = L.marker(result.center)
        .addTo(map)
        .bindPopup(result.name)
        .openPopup();
    });

    // صندوق موقعي
    const gpsPanel = document.createElement('div');
    gpsPanel.className = 'gps-panel';
    gpsPanel.innerHTML = `
      <div class="gps-heading">📍 موقعي</div>
      <button id="startGps" type="button">تحديد موقعي</button>
      <button id="stopGps" type="button">إيقاف التتبع</button>
      <div id="gpsStatus" aria-live="polite">اضغط لتحديد موقعك.</div>
    `;

    map.getContainer().appendChild(gpsPanel);

    /*
      الترتيب الجديد:
      أدوات الطبقات والبحث في الأعلى،
      ثم صندوق موقعي،
      مع مسافة بسيطة تفصل بين الصناديق.
    */
    function positionGpsPanel() {
      const searchElement = geocoder.getContainer();
      const layersElement = layersControl.getContainer();
      const mapRect = map.getContainer().getBoundingClientRect();

      if (!searchElement || !layersElement) return;

      const searchRect = searchElement.getBoundingClientRect();
      const layersRect = layersElement.getBoundingClientRect();

      const bottomEdge = Math.max(searchRect.bottom, layersRect.bottom);
      const desiredTop = bottomEdge - mapRect.top + 6;

      gpsPanel.style.top = Math.max(5, desiredTop) + 'px';
      gpsPanel.style.right = window.innerWidth <= 480 ? '5px' : '7px';
    }

    map.whenReady(function() {
      requestAnimationFrame(positionGpsPanel);
      setTimeout(positionGpsPanel, 300);
      setTimeout(positionGpsPanel, 900);
    });

    window.addEventListener('resize', positionGpsPanel);
    map.on('resize', positionGpsPanel);

    // متغيرات تحديد الموقع
    let gpsWatchId = null;
    let gpsMarker = null;
    let accuracyCircle = null;
    let currentLocation = null;
    let bestAccuracy = Infinity;
    let firstFixPending = false;

    const gpsStatus = gpsPanel.querySelector('#gpsStatus');
    const startGpsButton = gpsPanel.querySelector('#startGps');
    const stopGpsButton = gpsPanel.querySelector('#stopGps');

    // تحديد الموقع أو الرجوع إلى الموقع الحالي
    startGpsButton.addEventListener('click', function() {
      if (!navigator.geolocation) {
        gpsStatus.textContent = 'جهازك لا يدعم تحديد الموقع.';
        return;
      }

      if (gpsWatchId !== null) {
        if (currentLocation) {
          map.setView(currentLocation, Math.max(map.getZoom(), 17));

          if (gpsMarker) {
            gpsMarker.openPopup();
          }
        } else {
          gpsStatus.textContent = 'جارٍ الحصول على موقعك...';
        }
        return;
      }

      firstFixPending = true;
      bestAccuracy = Infinity;
      gpsStatus.textContent = 'جارٍ تحديد موقعك...';

      gpsWatchId = navigator.geolocation.watchPosition(
        function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          currentLocation = [latitude, longitude];

          if (accuracy < bestAccuracy) {
            bestAccuracy = accuracy;
          }

          if (!gpsMarker) {
            gpsMarker = L.marker(currentLocation).addTo(map);
          } else {
            gpsMarker.setLatLng(currentLocation);
          }

          gpsMarker.bindPopup(
            'أنت هنا<br>' +
            'دقة الموقع الحالية: ' +
            Math.round(accuracy) + ' متر'
          );

          if (!accuracyCircle) {
            accuracyCircle = L.circle(currentLocation, {
              radius: accuracy,
              color: '#1677ff',
              fillColor: '#1677ff',
              fillOpacity: 0.15,
              weight: 2
            }).addTo(map);
          } else {
            accuracyCircle.setLatLng(currentLocation);
            accuracyCircle.setRadius(accuracy);
          }

          // تحريك الخريطة عند أول قراءة فقط
          if (firstFixPending) {
            map.setView(currentLocation, 17);
            firstFixPending = false;
          }

          gpsStatus.innerHTML =
            'الدقة الحالية: ' + Math.round(accuracy) + ' م<br>' +
            'أفضل دقة: ' + Math.round(bestAccuracy) + ' م<br>' +
            'التتبع يعمل';
        },
        function(error) {
          let message = 'تعذر تحديد الموقع.';

          if (error.code === 1) {
            message = 'اسمح للصفحة بالوصول إلى موقعك.';
          } else if (error.code === 2) {
            message = 'الموقع غير متاح حاليًا.';
          } else if (error.code === 3) {
            message = 'انتهت مهلة تحديد الموقع.';
          }

          gpsStatus.textContent = message;

          if (gpsWatchId !== null) {
            navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = null;
          }

          firstFixPending = false;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 30000
        }
      );
    });

    // إيقاف التتبع مع الإبقاء على آخر موقع ظاهرًا
    stopGpsButton.addEventListener('click', function() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        firstFixPending = false;
        gpsStatus.textContent = 'تم إيقاف التتبع.';
      } else {
        gpsStatus.textContent = 'التتبع متوقف.';
      }
    });
  </script>
</body>
</html>
