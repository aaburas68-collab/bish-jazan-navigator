<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>ساهر | الملاحة الذكية</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/perliedman-leaflet-control-geocoder/2.4.0/Control.Geocoder.min.css">

  <style>
    * { box-sizing: border-box; }
    html, body, #map { width:100%; height:100%; margin:0; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
      overflow:hidden;
      background:#e9edf2;
    }
    #map { position:absolute; inset:0; }

    .panel {
      position:absolute; z-index:1000; top:12px; right:12px; left:12px;
      max-width:540px; margin:auto; padding:14px;
      border:1px solid rgba(255,255,255,.5);
      border-radius:20px; background:rgba(255,255,255,.96);
      box-shadow:0 8px 30px rgba(0,0,0,.16);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      direction:rtl;
    }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
    .brand-icon {
      width:42px; height:42px; display:grid; place-items:center;
      border-radius:14px; color:white; background:#2563eb; font-size:24px;
    }
    .brand h1 { font-size:19px; margin:0; font-weight:850; }
    .subtitle { color:#64748b; font-size:12px; margin-top:3px; }
    .search { margin-top:12px; }
    .search .leaflet-control-geocoder {
      width:100%; max-width:none; border:1px solid #e2e8f0;
      border-radius:12px; box-shadow:none; display:flex;
    }
    .leaflet-control-geocoder-form { flex:1; min-width:0; }
    .leaflet-control-geocoder input {
      width:100%; min-width:0; font-family:inherit;
      font-size:14px; text-align:right; direction:rtl;
    }
    .leaflet-control-geocoder-alternatives {
      direction:rtl; text-align:right; max-width:calc(100vw - 65px);
    }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    button {
      border:0; border-radius:12px; padding:11px 13px;
      font:inherit; font-size:13px; font-weight:750; cursor:pointer;
      min-height:42px; -webkit-tap-highlight-color:transparent;
    }
    button:disabled { opacity:.55; cursor:default; }
    .primary { background:#2563eb; color:white; }
    .dark { background:#172033; color:white; }
    .light { background:#eef2f7; color:#243044; }
    .danger { background:#fee2e2; color:#b91c1c; }

    .summary {
      margin-top:11px; border-radius:14px; background:#f8fafc;
      border:1px solid #e8edf4; padding:11px;
    }
    .summary-title { font-size:12px; color:#64748b; }
    .numbers { display:flex; gap:10px; margin-top:7px; }
    .metric {
      flex:1; min-width:0; background:white; border:1px solid #edf0f5;
      border-radius:11px; padding:9px;
    }
    .metric strong { display:block; font-size:19px; color:#172033; }
    .metric span { display:block; margin-top:3px; color:#64748b; font-size:11px; }
    #status { font-size:12px; line-height:1.7; color:#475569; margin-top:9px; }
    .legend { display:flex; gap:10px; flex-wrap:wrap; margin-top:9px; }
    .legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:#475569; }
    .dot { width:10px; height:10px; border-radius:50%; }
    .blue { background:#2563eb; }
    .red { background:#dc2626; }
    .yellow { background:#eab308; }
    .green { background:#16a34a; }

    .pin-wrap { background:transparent; border:0; }
    .nav-pin {
      --pin:#dc2626;
      width:38px; height:38px; position:relative;
      display:flex; align-items:center; justify-content:center;
      background:var(--pin); color:white;
      border:3px solid white; border-radius:50% 50% 50% 7px;
      transform:rotate(-45deg);
      box-shadow:0 3px 12px rgba(0,0,0,.3);
      transition:background .2s ease;
    }
    .nav-pin::after {
      content:""; position:absolute; width:10px; height:10px;
      border:2px solid white; border-radius:50%;
      background:rgba(255,255,255,.2);
    }
    .nav-pin.start { --pin:#2563eb; }
    .nav-pin.redpin { --pin:#dc2626; }
    .nav-pin.yellowpin { --pin:#eab308; }
    .nav-pin.greenpin { --pin:#16a34a; }
    .nav-pin.greenpin::before {
      content:"✓"; position:absolute; z-index:2; font-size:17px;
      font-weight:900; transform:rotate(45deg);
    }
    .pin-label {
      position:absolute; top:43px; left:50%; transform:translateX(-50%);
      white-space:nowrap; border-radius:8px; padding:4px 7px;
      color:#172033; background:white; border:1px solid #e2e8f0;
      box-shadow:0 2px 8px rgba(0,0,0,.15); font-size:11px; font-weight:800;
    }
    .leaflet-popup-content { font-family:inherit; direction:rtl; text-align:right; line-height:1.8; }
    .leaflet-control-layers {
      border:1px solid #dbe2eb!important; border-radius:12px!important;
      box-shadow:0 3px 14px rgba(0,0,0,.15)!important;
      font-family:inherit; direction:rtl;
    }
    .leaflet-top.leaflet-left { top:10px; left:8px; }
    .leaflet-control-zoom {
      border:1px solid #dbe2eb!important; border-radius:12px!important;
      overflow:hidden; box-shadow:0 3px 14px rgba(0,0,0,.15)!important;
    }
    .leaflet-control-zoom a {
      width:40px!important; height:40px!important; line-height:40px!important;
    }

    @media(max-width:420px) {
      .panel { top:7px; right:7px; left:7px; padding:11px; border-radius:17px; }
      .brand-icon { width:37px; height:37px; }
      .brand h1 { font-size:17px; }
      .numbers { gap:6px; }
      .metric { padding:8px 6px; }
      .metric strong { font-size:17px; }
      button { padding:10px; }
    }
  </style>
</head>
<body>
<div id="map" aria-label="خريطة ساهر للملاحة"></div>

<section class="panel">
  <div class="brand">
    <div class="brand-icon">📍</div>
    <div>
      <h1>ساهر | الملاحة الذكية</h1>
      <div class="subtitle">حدد موقعك ووجهتك، وتابع المسافة المتبقية</div>
    </div>
  </div>

  <div class="search" id="searchArea"></div>

  <div class="actions">
    <button class="primary" id="locateBtn">📍 موقعي ونقطة البداية</button>
    <button class="dark" id="routeBtn">🧭 احسب المسار</button>
    <button class="light" id="pickBtn">📌 تحديد الوجهة من الخريطة</button>
    <button class="danger" id="stopBtn">إيقاف التتبع</button>
    <button class="light" id="clearBtn">مسح المسار</button>
  </div>

  <div class="summary">
    <div class="summary-title" id="destinationTitle">الوجهة: لم تحدد بعد</div>
    <div class="numbers">
      <div class="metric">
        <strong id="remaining">—</strong>
        <span>المسافة المتبقية</span>
      </div>
      <div class="metric">
        <strong id="total">—</strong>
        <span>طول المسار الكامل</span>
      </div>
      <div class="metric">
        <strong id="eta">—</strong>
        <span>وقت القيادة التقديري</span>
      </div>
    </div>
    <div id="status" role="status" aria-live="polite">حدد موقعك ثم ابحث عن وجهتك أو اخترها من الخريطة.</div>
    <div class="legend">
      <div class="legend-item"><span class="dot blue"></span> البداية — 0 كم</div>
      <div class="legend-item"><span class="dot red"></span> أكثر من 5 كم</div>
      <div class="legend-item"><span class="dot yellow"></span> 5 كم أو أقل</div>
      <div class="legend-item"><span class="dot green"></span> وصول ضمن 100 م</div>
    </div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/perliedman-leaflet-control-geocoder/2.4.0/Control.Geocoder.min.js"></script>
<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const map = L.map("map", { zoomControl:true }).setView([17.38,42.54],11);

  const street = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom:19, attribution:"&copy; OpenStreetMap contributors" }
  ).addTo(map);

  const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom:22, maxNativeZoom:19, attribution:"Tiles &copy; Esri" }
  );

  const terrain = L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    { maxZoom:17, attribution:"&copy; OpenTopoMap contributors" }
  );

  L.control.layers({
    "الخريطة العادية":street,
    "الأقمار الصناعية":satellite,
    "التضاريس":terrain
  },null,{position:"topleft",collapsed:true}).addTo(map);

  const geocoder = L.Control.geocoder({
    defaultMarkGeocode:false,
    placeholder:"ابحث عن مدينة أو حي أو مكان",
    errorMessage:"لم يتم العثور على المكان",
    showResultIcons:false,
    geocoder:L.Control.Geocoder.nominatim({
      geocodingQueryParams:{"accept-language":"ar,en"}
    })
  }).addTo(map);
  $("searchArea").appendChild(geocoder.getContainer());

  const state = {
    start:null, destination:null, current:null,
    startMarker:null, destinationMarker:null, movingMarker:null,
    routeLine:null, routeCoords:[], routeCumulative:[],
    totalMeters:0, remainingMeters:null, watchId:null,
    pickDestination:false, routeName:""
  };

  function setStatus(message) { $("status").textContent=message; }
  function formatDistance(m) {
    if (!Number.isFinite(m)) return "—";
    if (m < 1000) return Math.max(0,Math.round(m))+" م";
    return (m/1000).toLocaleString("ar-SA",{maximumFractionDigits:1})+" كم";
  }
  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "—";
    const mins=Math.max(1,Math.round(seconds/60));
    if(mins<60) return mins+" دقيقة";
    const h=Math.floor(mins/60),m=mins%60;
    return h+" س"+(m ? " "+m+" د":"");
  }
  function pinIcon(type,label) {
    const safeLabel=String(label).replace(/[&<>"']/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
    return L.divIcon({
      className:"pin-wrap",
      html:`<div class="nav-pin ${type}"><span class="pin-label">${safeLabel}</span></div>`,
      iconSize:[38,56], iconAnchor:[19,19], popupAnchor:[0,-20]
    });
  }
  function placeStartMarker() {
    if(!state.start) return;
    if(state.startMarker) map.removeLayer(state.startMarker);
    state.startMarker=L.marker(state.start,{
      icon:pinIcon("start","البداية · 0 كم"),
      title:"نقطة البداية"
    }).addTo(map);
    state.startMarker.bindPopup("🔵 نقطة البداية<br>المسافة عند الانطلاق: 0 كم");
  }
  function placeDestinationMarker() {
    if(!state.destination) return;
    if(state.destinationMarker) map.removeLayer(state.destinationMarker);
    state.destinationMarker=L.marker(state.destination,{
      icon:pinIcon("greenpin","الوجهة"),
      title:"الوجهة"
    }).addTo(map);
    state.destinationMarker.bindPopup("📍 وجهتك المحددة");
  }
  function placeMovingMarker(position,color,label) {
    if(state.movingMarker) {
      state.movingMarker.setLatLng(position);
      state.movingMarker.setIcon(pinIcon(color,label));
    } else {
      state.movingMarker=L.marker(position,{
        icon:pinIcon(color,label), title:"موقعك أثناء الملاحة", zIndexOffset:1000
      }).addTo(map);
    }
  }
  function haversine(a,b) {
    const R=6371000, rad=Math.PI/180;
    const lat1=a[0]*rad,lat2=b[0]*rad;
    const dLat=(b[0]-a[0])*rad,dLon=(b[1]-a[1])*rad;
    const q=Math.sin(dLat/2)**2+
      Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(Math.min(1,q)));
  }
  function clearRoute() {
    if(state.routeLine) map.removeLayer(state.routeLine);
    state.routeLine=null;
    state.routeCoords=[];
    state.routeCumulative=[];
    state.totalMeters=0;
    state.remainingMeters=null;
    $("remaining").textContent="—";
    $("total").textContent="—";
    $("eta").textContent="—";
  }
  function clearAllRouteData() {
    clearRoute();
    if(state.movingMarker) map.removeLayer(state.movingMarker);
    state.movingMarker=null;
  }

  geocoder.on("markgeocode",e=>{
    const c=e.geocode.center;
    state.destination=[c.lat,c.lng];
    state.routeName=e.geocode.name || "الوجهة المحددة";
    $("destinationTitle").textContent="الوجهة: "+state.routeName;
    placeDestinationMarker();
    map.setView(c,15);
    clearAllRouteData();
    setStatus("تم تحديد الوجهة. اضغط «احسب المسار» بعد تحديد موقع البداية.");
  });

  $("locateBtn").addEventListener("click",()=>{
    if(!navigator.geolocation) {
      setStatus("المتصفح لا يدعم تحديد الموقع.");
      return;
    }
    setStatus("جارٍ تحديد موقعك… اسمح للمتصفح بالوصول إلى الموقع.");
    navigator.geolocation.getCurrentPosition(pos=>{
      const p=[pos.coords.latitude,pos.coords.longitude];
      state.current=p;
      state.start=p;
      placeStartMarker();
      if(state.movingMarker) state.movingMarker.setLatLng(p);
      map.setView(p,16);
      setStatus("تم تحديد نقطة البداية باللون الأزرق. اختر وجهتك ثم احسب المسار.");
      startTracking();
    },err=>{
      setStatus(err.code===1
        ?"إذن الموقع مرفوض. فعّل إذن الموقع للمتصفح."
        :"تعذر تحديد الموقع. تأكد من تشغيل خدمات الموقع وحاول مجددًا.");
    },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  });

  $("pickBtn").addEventListener("click",()=>{
    state.pickDestination=true;
    setStatus("اضغط على المكان المطلوب في الخريطة لتحديد الوجهة.");
  });

  map.on("click",e=>{
    if(!state.pickDestination) return;
    state.pickDestination=false;
    state.destination=[e.latlng.lat,e.latlng.lng];
    state.routeName="الوجهة المحددة على الخريطة";
    $("destinationTitle").textContent="الوجهة: محددة على الخريطة";
    placeDestinationMarker();
    clearAllRouteData();
    setStatus("تم اختيار الوجهة. اضغط «احسب المسار».");
  });

  $("routeBtn").addEventListener("click",calculateRoute);

  async function calculateRoute() {
    if(!state.start) {
      setStatus("حدد نقطة البداية أولًا بالضغط على «موقعي ونقطة البداية».");
      return;
    }
    if(!state.destination) {
      setStatus("ابحث عن وجهتك أو اخترها من الخريطة أولًا.");
      return;
    }
    $("routeBtn").disabled=true;
    setStatus("جارٍ حساب مسار القيادة…");
    try {
      const [aLat,aLon]=state.start;
      const [bLat,bLon]=state.destination;
      const url=`https://router.project-osrm.org/route/v1/driving/${aLon},${aLat};${bLon},${bLat}?overview=full&geometries=geojson&steps=true`;
      const response=await fetch(url);
      if(!response.ok) throw new Error("تعذر الوصول إلى خدمة المسارات.");
      const data=await response.json();
      if(data.code!=="Ok"||!data.routes||!data.routes.length) {
        throw new Error("لم يتم العثور على مسار قيادة مناسب.");
      }
      const route=data.routes[0];
      clearAllRouteData();

      state.routeCoords=route.geometry.coordinates.map(c=>[c[1],c[0]]);
      state.routeCumulative=[0];
      for(let i=1;i<state.routeCoords.length;i++) {
        state.routeCumulative[i]=state.routeCumulative[i-1]+
          haversine(state.routeCoords[i-1],state.routeCoords[i]);
      }
      state.totalMeters=route.distance;
      state.remainingMeters=route.distance;

      state.routeLine=L.polyline(state.routeCoords,{
        color:"#2563eb",weight:6,opacity:.88,lineCap:"round",lineJoin:"round"
      }).addTo(map);

      $("total").textContent=formatDistance(route.distance);
      $("remaining").textContent=formatDistance(route.distance);
      $("eta").textContent=formatTime(route.duration);
      placeStartMarker();
      placeDestinationMarker();

      if(state.current) updateMovingPin(state.current);
      else placeMovingMarker(state.start,"redpin",formatDistance(route.distance));

      map.fitBounds(state.routeLine.getBounds(),{paddingTopLeft:[25,240],paddingBottomRight:[25,45]});
      setStatus("تم حساب مسار القيادة. فعّل تتبع الموقع وراقب لون الدبوس والمسافة المتبقية.");
      const roads=(route.legs||[]).flatMap(leg=>(leg.steps||[]).map(s=>s.name).filter(Boolean));
      if(roads.length) {
        const unique=[...new Set(roads)].slice(0,5);
        state.routeLine.bindPopup("أبرز الطرق في المسار:<br>"+unique.join("<br>"));
      }
    } catch(err) {
      setStatus((err&&err.message?err.message:"حدث خطأ أثناء حساب المسار")+
        " قد تكون خدمة المسارات مشغولة؛ حاول مرة أخرى.");
    } finally {
      $("routeBtn").disabled=false;
    }
  }

  // إيجاد أقرب نقطة على المسار لتقدير المسافة المتبقية.
  // تعتمد هذه الطريقة على هندسة المسار وموقع GPS، وليست قياسًا رسميًا للمسافة المقطوعة.
  function distanceAlongRoute(point) {
    if(state.routeCoords.length<2) return null;
    let best={distance:Infinity,remaining:state.totalMeters};
    for(let i=0;i<state.routeCoords.length-1;i++) {
      const a=state.routeCoords[i],b=state.routeCoords[i+1];
      const midLat=(a[0]+b[0]+point[0])/3*Math.PI/180;
      const scaleX=111320*Math.cos(midLat),scaleY=110540;
      const ax=a[1]*scaleX,ay=a[0]*scaleY;
      const bx=b[1]*scaleX,by=b[0]*scaleY;
      const px=point[1]*scaleX,py=point[0]*scaleY;
      const dx=bx-ax,dy=by-ay;
      const denom=dx*dx+dy*dy;
      let t=denom ? ((px-ax)*dx+(py-ay)*dy)/denom : 0;
      t=Math.max(0,Math.min(1,t));
      const nearest=[a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])];
      const d=haversine(point,nearest);
      if(d<best.distance) {
        const segment=state.routeCumulative[i+1]-state.routeCumulative[i];
        best={distance:d,remaining:Math.max(0,state.totalMeters-(state.routeCumulative[i]+segment*t))};
      }
    }
    return best;
  }

  function updateMovingPin(position) {
    if(!state.destination) {
      placeMovingMarker(position,"redpin","موقعك الحالي");
      return;
    }
    const direct=haversine(position,state.destination);
    let remaining=direct;
    if(state.routeCoords.length>1) {
      const projected=distanceAlongRoute(position);
      if(projected && projected.distance<3000) remaining=projected.remaining;
    }
    state.remainingMeters=remaining;
    $("remaining").textContent=formatDistance(remaining);

    let color="redpin",message="ما زلت في الطريق إلى وجهتك.";
    if(direct<=100) {
      color="greenpin";
      message="وصلت إلى نطاق الوجهة: تبعد 100 متر أو أقل.";
    } else if(remaining<=5000) {
      color="yellowpin";
      message="اقتربت من الوجهة؛ المتبقي نحو "+formatDistance(remaining)+".";
    }
    placeMovingMarker(position,color,formatDistance(remaining));
    setStatus(message);
  }

  function startTracking() {
    if(!navigator.geolocation || state.watchId!==null) return;
    state.watchId=navigator.geolocation.watchPosition(pos=>{
      const p=[pos.coords.latitude,pos.coords.longitude];
      state.current=p;
      if(!state.start) {
        state.start=p;
        placeStartMarker();
      }
      updateMovingPin(p);
    },err=>{
      if(err.code===1) setStatus("تم رفض إذن الموقع. فعّل إذن الموقع للمتصفح.");
      else setStatus("تعذر تحديث GPS حاليًا. تحقق من إعدادات الموقع.");
    },{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
  }

  $("stopBtn").addEventListener("click",()=>{
    if(state.watchId!==null) {
      navigator.geolocation.clearWatch(state.watchId);
      state.watchId=null;
    }
    setStatus("تم إيقاف تتبع GPS. آخر موقع ما زال ظاهرًا على الخريطة.");
  });

  $("clearBtn").addEventListener("click",()=>{
    clearAllRouteData();
    state.destination=null;
    state.routeName="";
    $("destinationTitle").textContent="الوجهة: لم تحدد بعد";
    if(state.destinationMarker) map.removeLayer(state.destinationMarker);
    state.destinationMarker=null;
    setStatus("تم مسح المسار والوجهة. نقطة البداية ما زالت محفوظة.");
  });

  // إظهار بداية زرقاء حتى بعد تحديث الصفحة غير مطلوب؛ يبدأ التحديد عند طلب GPS.
  window.addEventListener("pagehide",()=>{
    if(state.watchId!==null) navigator.geolocation.clearWatch(state.watchId);
  });
})();
</script>
</body>
</html>
