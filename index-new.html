<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#101827">
  <title>ساهر | الملاحة الذكية</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --bg: #101827;
      --panel: #182336;
      --panel2: #202e43;
      --text: #f4f7fb;
      --muted: #9eacc0;
      --accent: #47d7a0;
      --accent-dark: #163f36;
      --border: rgba(255,255,255,.09);
      --danger: #ff7272;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .topbar {
      z-index: 1200;
      min-height: 62px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(16,24,39,.97);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--accent-dark);
      font-size: 22px;
      flex-shrink: 0;
    }

    .brand-name { font-size: 17px; font-weight: 800; }
    .brand-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }

    .gps-status {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8793a6;
    }

    .status-dot.active { background: var(--accent); }

    .search-wrap {
      position: absolute;
      z-index: 1100;
      top: 76px;
      right: 14px;
      left: 14px;
      max-width: 570px;
      margin-inline: auto;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      color: #182336;
      box-shadow: 0 8px 30px rgba(0,0,0,.22);
    }

    .search-icon { font-size: 19px; padding-inline: 6px; }

    .search-box input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: none;
      color: #182336;
      background: transparent;
      padding: 10px 0;
      font-size: 14px;
    }

    .search-btn {
      border: 0;
      background: #182336;
      color: white;
      padding: 10px 15px;
      border-radius: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .search-results {
      display: none;
      margin-top: 8px;
      background: #fff;
      color: #182336;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      max-height: 38vh;
      overflow-y: auto;
    }

    .search-results.open { display: block; }

    .result-item {
      width: 100%;
      text-align: right;
      padding: 13px 15px;
      background: white;
      color: #182336;
      border: 0;
      border-bottom: 1px solid #e9edf2;
      display: block;
    }

    .result-item:last-child { border-bottom: 0; }
    .result-item:active { background: #edf7f3; }
    .result-title { font-weight: 750; font-size: 13px; }
    .result-sub { color: #64748b; font-size: 11px; margin-top: 5px; line-height: 1.6; }
    .search-message { padding: 14px; color: #64748b; font-size: 13px; }

    .map-area {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #dce4e8;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 1px;
      z-index: 1;
    }

    .map-tools {
      position: absolute;
      z-index: 900;
      top: 145px;
      left: 13px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .map-btn {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(20,35,50,.12);
      border-radius: 14px;
      background: white;
      color: #182336;
      box-shadow: 0 3px 12px rgba(0,0,0,.17);
      font-size: 20px;
      display: grid;
      place-items: center;
    }

    .map-btn:active { transform: scale(.96); }

    .layer-menu {
      display: none;
      position: absolute;
      left: 52px;
      top: 53px;
      width: 160px;
      background: white;
      color: #182336;
      border-radius: 14px;
      padding: 7px;
      box-shadow: 0 5px 20px rgba(0,0,0,.2);
    }

    .layer-menu.open { display: block; }

    .layer-option {
      display: block;
      width: 100%;
      border: 0;
      padding: 11px 9px;
      text-align: right;
      background: transparent;
      color: #182336;
      border-radius: 9px;
      font-size: 13px;
    }

    .layer-option.selected { background: #e2f8ef; color: #08754d; font-weight: 800; }

    .map-hint {
      position: absolute;
      z-index: 700;
      bottom: 12px;
      left: 12px;
      padding: 8px 11px;
      border-radius: 11px;
      background: rgba(16,24,39,.85);
      color: #fff;
      font-size: 11px;
      pointer-events: none;
    }

    .bottom-panel {
      z-index: 1000;
      flex-shrink: 0;
      max-height: 53%;
      overflow-y: auto;
      background: var(--bg);
      border-top: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -8px 30px rgba(0,0,0,.15);
      padding: 9px 16px calc(13px + env(safe-area-inset-bottom));
      scrollbar-width: thin;
    }

    .grabber {
      width: 38px;
      height: 4px;
      border-radius: 5px;
      background: #465369;
      margin: 0 auto 12px;
    }
    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 13px;
    }

    .panel-title { font-size: 16px; font-weight: 800; }
    .panel-subtitle { color: var(--muted); font-size: 11px; margin-top: 4px; }

    .text-btn {
      color: var(--muted);
      background: transparent;
      border: 0;
      padding: 8px;
      font-size: 12px;
    }

    .fields { display: grid; gap: 9px; }

    .route-field {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 0 12px;
      min-height: 48px;
    }

    .field-icon {
      width: 25px;
      text-align: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .field-body { min-width: 0; flex: 1; }
    .field-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }

    .route-field input {
      width: 100%;
      min-width: 0;
      background: transparent;
      color: var(--text);
      border: 0;
      outline: 0;
      padding: 0 0 2px;
      font-size: 13px;
    }

    .route-field input::placeholder { color: #7e8ca1; }

    .small-field-btn {
      background: var(--panel2);
      border: 0;
      color: var(--text);
      padding: 8px 9px;
      border-radius: 9px;
      font-size: 11px;
      white-space: nowrap;
    }

    .main-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: 9px;
      margin-top: 12px;
      direction: rtl;
    }

    .main-actions button {
      min-width: 0;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .main-actions #pickStartBtn {
      background: #1689ff !important;
      color: #ffffff !important;
      border: 1px solid #1689ff !important;
    }

    .main-actions #mapDestinationBtn {
      background: #22c55e !important;
      color: #ffffff !important;
      border: 1px solid #22c55e !important;
    }

    .primary-btn {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #10251f;
      font-weight: 850;
      padding: 12px 16px;
    }

    .secondary-btn {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel2);
      color: var(--text);
      padding: 10px 14px;
      font-weight: 650;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    .route-summary {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 13px;
      margin-top: 12px;
    }

    .route-summary.show { display: block; }

    .summary-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .summary-destination { font-weight: 800; font-size: 13px; }
    .summary-note { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .summary-stats { display: flex; gap: 18px; margin-top: 13px; }
    .stat-label { color: var(--muted); font-size: 10px; }
    .stat-value { font-size: 18px; font-weight: 850; margin-top: 4px; }
    .trip-progress { height: 5px; background: #344259; border-radius: 5px; overflow: hidden; margin-top: 13px; }
    .trip-progress > div { width: 0; height: 100%; background: var(--accent); transition: width .15s linear; }

    .trip-actions { display: none; gap: 8px; margin-top: 12px; }
    .trip-actions.show { display: grid; grid-template-columns: 1fr 1fr; }

    .more-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 13px 2px 4px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }

    .more-content { display: none; padding-top: 10px; }
    .more-content.open { display: block; }

    .more-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .more-grid button {
      min-height: 41px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      color: var(--text);
      padding: 9px;
      font-size: 12px;
    }

    .more-grid #routeBtn {
      background: #22c55e !important;
      border-color: #22c55e !important;
      color: #ffffff !important;
    }

    @media (max-width: 420px) {
      .main-actions { gap: 6px; }
      .main-actions button { padding-inline: 6px; font-size: 11px; }
    }

    .place-info {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px;
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .place-info.show { display: block; }
    .place-info a { color: var(--accent); }

    .road-info {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
      margin-top: 10px;
    }

    .toast {
      position: absolute;
      z-index: 2000;
      top: 128px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 11px 15px;
      background: #182336;
      color: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,.25);
      }
      .car-marker {
      width: 30px;
      height: 30px;
      border: 3px solid white;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .car-marker::after {
      content: "";
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
    }

    .car-marker.pin-red { background: #ef4444; }
    .car-marker.pin-yellow { background: #facc15; }
    .car-marker.pin-green { background: #22c55e; }

    @media (max-width: 380px) {
      .topbar { padding-inline: 10px; }
      .brand-name { font-size: 15px; }
      .gps-status { font-size: 10px; }
      .bottom-panel { padding-inline: 11px; }
      .main-actions { gap: 6px; }
      .main-actions button { font-size: 11px; padding-inline: 8px; }
      .swap-btn { width: 42px; min-width: 42px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- واجهة التطبيق وعناصر الخريطة -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">🧭</div>
        <div>
          <div class="brand-name">ساهر | الملاحة الذكية</div>
          <div class="brand-sub">ملاحة ذكية وتتبع مباشر للمسار</div>
        </div>
      </div>
      <div class="gps-status">
        <span class="status-dot" id="gpsDot"></span>
        <span id="gpsStatus">الموقع غير محدد</span>
      </div>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search"
               placeholder="ابحث عن مكان أو مدينة..."
               autocomplete="off">
        <button class="search-btn" id="searchBtn">بحث</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>

    <main class="map-area">
      <div id="map"></div>
      <div class="map-tools">
        <button class="map-btn" id="locateBtn" title="موقعي الحالي">◎</button>
        <button class="map-btn" id="layersBtn" title="طبقات الخريطة">▤</button>
        <div class="layer-menu" id="layerMenu">
          <button class="layer-option selected" data-layer="street">خريطة الشوارع</button>
          <button class="layer-option" data-layer="satellite">القمر الصناعي</button>
          <button class="layer-option" data-layer="topo">التضاريس</button>
        </div>
        <button class="map-btn" id="zoomInBtn" title="تكبير">＋</button>
        <button class="map-btn" id="zoomOutBtn" title="تصغير">−</button>
      </div>
      <div class="map-hint" id="mapHint">حدد البداية والوجهة لرسم المسار</div>
      <div class="toast" id="toast"></div>
    </main>

    <section class="bottom-panel">
      <div class="grabber"></div>
      <div class="panel-heading">
        <div>
          <div class="panel-title">تخطيط الرحلة</div>
          <div class="panel-subtitle">حدد نقطة البداية والوجهة</div>
        </div>
        <button class="text-btn" id="clearBtn">مسح الكل</button>
      </div>

      <div class="fields">
        <div class="route-field">
          <div class="field-icon">🔵</div>
          <div class="field-body">
            <div class="field-label">نقطة البداية</div>
            <input id="startInput" type="text" placeholder="اختر نقطة البداية">
          </div>
          <button class="small-field-btn" id="startCurrentBtn">موقعي</button>
        </div>
        <div class="route-field">
          <div class="field-icon">🟢</div>
          <div class="field-body">
            <div class="field-label">الوجهة</div>
            <input id="destinationInput" type="text" placeholder="إلى أين تريد الذهاب؟">
          </div>
          <button class="small-field-btn" id="destinationClearBtn">مسح</button>
        </div>
      </div>

      <div class="main-actions">
        <button class="secondary-btn" id="pickStartBtn">تحديد البداية من الخريطة</button>
        <button class="secondary-btn" id="mapDestinationBtn">تحديد الوجهة من الخريطة</button>
        <button class="swap-btn" id="swapBtn" title="تبديل البداية والوجهة">⇅</button>
      </div>

      <button class="more-toggle" id="moreToggle">
        <span>خيارات إضافية</span><span id="moreArrow">⌄</span>
      </button>
      <div class="more-options" id="moreOptions">
        <div class="more-grid">
          <button class="primary-btn" id="drawRouteBtn">ارسم المسار</button>
       <button id="startNavigationBtn">بدء الملاحة</button>
<button id="launchBtn" class="primary-btn">🚗 انطلق</button>
          <button id="simulateBtn">محاكاة الرحلة</button>
          <button id="stopSimulationBtn">إيقاف المحاكاة</button>
          <button id="fitRouteBtn">عرض المسار كاملًا</button>
          <button id="clearRouteBtn">حذف المسار</button>
        </div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);

  // منع تشغيل التطبيق إذا لم تُحمّل مكتبة Leaflet
  if (typeof L === "undefined") {
    alert("تعذر تحميل مكتبة الخريطة. تحقق من اتصال الإنترنت.");
    return;
  }

  const map = L.map("map", { zoomControl: false })
    .setView([17.1495, 42.6254], 10);

  const layers = {
    street: L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      { maxZoom: 19, attribution: "&copy; OpenStreetMap" }
    ),
    satellite: L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 19, attribution: "Tiles &copy; Esri" }
    ),
    topo: L.tileLayer(
      "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
      { maxZoom: 17, attribution: "&copy; OpenTopoMap" }
    )
  };

  let activeLayer = "street";
  layers.street.addTo(map);

  let startPoint = null;
  let destinationPoint = null;
  let startMarker = null;
  let destinationMarker = null;
  let userMarker = null;
  let routeLine = null;
  let selectingPoint = null;
  let searchTimer = null;
  let simulationTimer = null;
let routeCoordinates = [];
let movingMarker = null;
let simulationIndex = 0;
  function toast(message) {
    const el = $("toast");
    if (!el) return;
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.remove("show"), 2800);
  }

  function updateGpsStatus(message, active = false) {
    if ($("gpsStatus")) $("gpsStatus").textContent = message;
    if ($("gpsDot")) $("gpsDot").classList.toggle("active", active);
  }

  function makePin(color) {
    return L.divIcon({
      className: "",
      html: `<div style="width:20px;height:20px;background:${color};border:3px solid white;border-radius:50%;box-shadow:0 1px 6px #333"></div>`,
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });
  }

  function syncMarkers() {
    if (startMarker) map.removeLayer(startMarker);
    if (destinationMarker) map.removeLayer(destinationMarker);

    if (startPoint) {
      startMarker = L.marker(startPoint, {
        icon: makePin("#1689ff")
      }).addTo(map);
    }

    if (destinationPoint) {
      destinationMarker = L.marker(destinationPoint, {
        icon: makePin("#22c55e")
      }).addTo(map);
    }
  }

  function updateInputs() {
    $("startInput").value = startPoint
      ? `${startPoint.lat.toFixed(5)}, ${startPoint.lng.toFixed(5)}`
      : "";

    $("destinationInput").value = destinationPoint
      ? `${destinationPoint.lat.toFixed(5)}, ${destinationPoint.lng.toFixed(5)}`
      : "";
  }

  function setStart(point) {
    startPoint = L.latLng(point.lat, point.lng);
    syncMarkers();
    updateInputs();
    toast("تم تحديد نقطة البداية");
  }

  function setDestination(point) {
    destinationPoint = L.latLng(point.lat, point.lng);
    syncMarkers();
    updateInputs();
    toast("تم تحديد الوجهة");
  }

  map.on("click", (event) => {
    if (selectingPoint === "start") {
      setStart(event.latlng);
    } else if (selectingPoint === "destination") {
      setDestination(event.latlng);
    } else {
      return;
    }

    selectingPoint = null;
    $("mapHint").textContent = "حدد البداية والوجهة لرسم المسار";
  });

  $("pickStartBtn").addEventListener("click", () => {
    selectingPoint = "start";
    $("mapHint").textContent = "اضغط على الخريطة لتحديد البداية";
    toast("اختر نقطة البداية من الخريطة");
  });

  $("mapDestinationBtn").addEventListener("click", () => {
    selectingPoint = "destination";
    $("mapHint").textContent = "اضغط على الخريطة لتحديد الوجهة";
    toast("اختر الوجهة من الخريطة");
  });

  $("swapBtn").addEventListener("click", () => {
    const temp = startPoint;
    startPoint = destinationPoint;
    destinationPoint = temp;
    syncMarkers();
    updateInputs();
    if (routeLine) drawRoute();
  });

  $("layersBtn").addEventListener("click", () => {
    $("layerMenu").classList.toggle("open");
  });

  document.querySelectorAll(".layer-option").forEach((button) => {
    button.addEventListener("click", () => {
      const name = button.dataset.layer;
      if (!layers[name]) return;

      map.removeLayer(layers[activeLayer]);
      activeLayer = name;
      layers[name].addTo(map);

      document.querySelectorAll(".layer-option").forEach((item) => {
        item.classList.toggle("selected", item === button);
      });
      $("layerMenu").classList.remove("open");
    });
  });

  $("zoomInBtn").addEventListener("click", () => map.zoomIn());
  $("zoomOutBtn").addEventListener("click", () => map.zoomOut());

  function locateUser() {
    if (!navigator.geolocation) {
      toast("المتصفح لا يدعم تحديد الموقع");
      return;
    }

    updateGpsStatus("جارٍ تحديد الموقع...");

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const point = L.latLng(
          position.coords.latitude,
          position.coords.longitude
        );

        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker(point).addTo(map)
          .bindPopup("موقعي الحالي");

        map.setView(point, 16);
        setStart(point);
        updateGpsStatus("تم تحديد الموقع", true);
      },
      () => {
        updateGpsStatus("تعذر تحديد الموقع");
        toast("اسمح للمتصفح بالوصول إلى موقعك");
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  $("locateBtn").addEventListener("click", locateUser);
  $("startCurrentBtn").addEventListener("click", locateUser);

  async function drawRoute() {
    if (!startPoint || !destinationPoint) {
      toast("حدد نقطة البداية والوجهة أولًا");
      return;
    }

    toast("جارٍ حساب المسار...");

    try {
      const url =
        "https://router.project-osrm.org/route/v1/driving/" +
        `${startPoint.lng},${startPoint.lat};` +
        `${destinationPoint.lng},${destinationPoint.lat}` +
        "?overview=full&geometries=geojson";

      const response = await fetch(url);
      if (!response.ok) throw new Error("route");

      const data = await response.json();
      if (!data.routes || !data.routes.length) {
        throw new Error("no-route");
      }

      const route = data.routes[0];
      const coordinates = route.geometry.coordinates.map(
        ([lng, lat]) => [lat, lng]
      );

      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline(coordinates, {
        color: "#1689ff",
        weight: 6,
        opacity: 0.9
      }).addTo(map);

      map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });

      const km = route.distance / 1000;
      const minutes = Math.round(route.duration / 60);
      toast(`المسافة ${km.toFixed(1)} كم تقريبًا • ${minutes} دقيقة`);
    } catch (error) {
      console.error(error);
      toast("تعذر حساب المسار. تحقق من الإنترنت وحاول مجددًا.");
    }
  }

  $("drawRouteBtn").addEventListener("click", drawRoute);

  $("fitRouteBtn").addEventListener("click", () => {
    if (routeLine) map.fitBounds(routeLine.getBounds(), {
      padding: [40, 40]
    });
    else toast("ارسم المسار أولًا");
  });

  $("clearRouteBtn").addEventListener("click", () => {
    if (routeLine) map.removeLayer(routeLine);
    routeLine = null;
    toast("تم حذف المسار");
  });

  $("clearBtn").addEventListener("click", () => {
    startPoint = null;
    destinationPoint = null;
    if (routeLine) map.removeLayer(routeLine);
    routeLine = null;
    syncMarkers();
    updateInputs();
    toast("تم مسح نقاط الرحلة");
  });

  $("destinationClearBtn").addEventListener("click", () => {
    destinationPoint = null;
    if (routeLine) map.removeLayer(routeLine);
    routeLine = null;
    syncMarkers();
    updateInputs();
  });

  async function searchPlaces() {
    const query = $("searchInput").value.trim();
    const results = $("searchResults");
    if (!query) {
      results.classList.remove("open");
      return;
    }

    results.innerHTML = '<div class="search-message">جارٍ البحث...</div>';
    results.classList.add("open");

    try {
      const url =
        "https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ar&q=" +
        encodeURIComponent(query);

      const response = await fetch(url);
      if (!response.ok) throw new Error("search");

      const places = await response.json();
      results.innerHTML = "";

      if (!places.length) {
        results.innerHTML =
          '<div class="search-message">لم يتم العثور على نتائج</div>';
        return;
      }

      places.forEach((place) => {
        const button = document.createElement("button");
        button.className = "result-item";
        button.innerHTML =
          `<div class="result-title"></div>` +
          `<div class="result-sub">اضغط لعرض الموقع على الخريطة</div>`;
        button.querySelector(".result-title").textContent =
          place.display_name;

        button.addEventListener("click", () => {
          const point = L.latLng(Number(place.lat), Number(place.lon));
          map.setView(point, 15);

          if (selectingPoint === "start") setStart(point);
          else if (selectingPoint === "destination") setDestination(point);

          results.classList.remove("open");
        });

        results.appendChild(button);
      });
    } catch (error) {
      console.error(error);
      results.innerHTML =
        '<div class="search-message">تعذر البحث. تحقق من الإنترنت وحاول مجددًا.</div>';
    }
  }

  $("searchBtn").addEventListener("click", searchPlaces);
  $("searchInput").addEventListener("keydown", (event) => {
    if (event.key === "Enter") searchPlaces();
  });

  $("searchInput").addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(searchPlaces, 700);
  });

  $("moreToggle").addEventListener("click", () => {
    const options = $("moreOptions");
    const open = options.style.display !== "block";
    options.style.display = open ? "block" : "none";
    $("moreArrow").textContent = open ? "⌃" : "⌄";
  });

  $("simulateBtn").addEventListener("click", () => {
    if (!routeLine) {
      toast("ارسم المسار أولًا");
      return;
    }

    toast("المسار جاهز. المحاكاة المتحركة غير مفعلة في هذه النسخة.");
  });

  $("stopSimulationBtn").addEventListener("click", () => {
    clearInterval(simulationTimer);
    simulationTimer = null;
    toast("تم إيقاف المحاكاة");
  });

  $("startNavigationBtn").addEventListener("click", () => {
    if (!routeLine) {
      toast("ارسم المسار أولًا");
      return;
    }
    toast("تم عرض المسار. هذه النسخة لا توفر توجيهًا صوتيًا مباشرًا.");
  });

  window.addEventListener("resize", () => map.invalidateSize());
  setTimeout(() => map.invalidateSize(), 300);
})();
</script>
</body>
</html>
