<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خريطة بيش وجازان</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css"
  >

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .leaflet-control-layers,
    .leaflet-control-geocoder {
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .location-panel {
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 1px 5px #999;
      font-family: Arial, sans-serif;
      font-size: 14px;
      min-width: 150px;
    }

    .location-panel button {
      border: 0;
      border-radius: 5px;
      padding: 9px 12px;
      margin-top: 7px;
      width: 100%;
      cursor: pointer;
      font-size: 14px;
      background: #1769aa;
      color: white;
    }

    .location-panel button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .location-status {
      margin-top: 7px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>

  <script>
    // إنشاء الخريطة
    const map = L.map('map').setView([17.45, 42.55], 9);

    // الخريطة العادية
    const standardMap = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; OpenStreetMap contributors'
      }
    );

    // التضاريس والارتفاعات
    const terrainMap = L.tileLayer(
      'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 17,
        attribution: 'Map data: OpenStreetMap contributors, SRTM | OpenTopoMap'
      }
    );

    // صور الأقمار الصناعية
    const satelliteMap = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Tiles &copy; Esri'
      }
    );

    standardMap.addTo(map);

    // خيارات الخرائط
    L.control.layers(
      {
        'الخريطة العادية': standardMap,
        'التضاريس والارتفاعات': terrainMap,
        'صور الأقمار الصناعية': satelliteMap
      },
      null,
      {
        collapsed: false
      }
    ).addTo(map);

    // البحث بالعربي والإنجليزي
    L.Control.geocoder({
      defaultMarkGeocode: true,
      placeholder: 'ابحث عن مدينة أو مكان...',
      errorMessage: 'لم يتم العثور على المكان'
    }).addTo(map);

    // عناصر الموقع
    let locationMarker = null;
    let accuracyCircle = null;
    let watchId = null;
    let bestAccuracy = Infinity;
    let latestPosition = null;

    // لوحة الموقع
    const LocationControl = L.Control.extend({
      options: {
        position: 'bottomleft'
      },

      onAdd: function () {
        const panel = L.DomUtil.create('div', 'location-panel');

        panel.innerHTML = `
          <strong>موقعي الحالي</strong>
          <div class="location-status" id="locationStatus">
            اضغط لبدء تحديد موقعك
          </div>
          <button type="button" id="startLocation">
            تحديد موقعي ومتابعته
          </button>
          <button type="button" id="stopLocation" disabled>
            إيقاف المتابعة
          </button>
        `;

        L.DomEvent.disableClickPropagation(panel);

        L.DomEvent.on(panel, 'click', function (event) {
          L.DomEvent.stopPropagation(event);
        });

        return panel;
      }
    });

    map.addControl(new LocationControl());

    const status = () => document.getElementById('locationStatus');
    const startButton = () => document.getElementById('startLocation');
    const stopButton = () => document.getElementById('stopLocation');

    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      if (stopButton()) stopButton().disabled = true;
      if (startButton()) {
        startButton().disabled = false;
        startButton().textContent = 'تحديد موقعي ومتابعته';
      }
    }

    function updateLocation(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;
      const point = [lat, lng];

      latestPosition = position;

      // إنشاء العلامة أو تحديث موقعها
      if (!locationMarker) {
        locationMarker = L.marker(point).addTo(map);
      } else {
        locationMarker.setLatLng(point);
      }

      // تحديث دائرة الدقة
      if (!accuracyCircle) {
        accuracyCircle = L.circle(point, {
          radius: accuracy,
          color: '#1769aa',
          fillColor: '#1769aa',
          fillOpacity: 0.12
        }).addTo(map);
      } else {
        accuracyCircle.setLatLng(point);
        accuracyCircle.setRadius(accuracy);
      }

      locationMarker.bindPopup(
        'أنت هنا<br>دقة الموقع التقريبية: ' +
        Math.round(accuracy) + ' متر'
      );

      // حفظ أفضل دقة رقمية وصلت أثناء الجلسة
      if (accuracy < bestAccuracy) {
        bestAccuracy = accuracy;
      }

      status().innerHTML =
        'الدقة الحالية: <strong>' + Math.round(accuracy) +
        ' متر</strong><br>' +
        'أفضل دقة في هذه الجلسة: <strong>' +
        Math.round(bestAccuracy) + ' متر</strong><br>' +
        'تتحدث القراءة تلقائيًا أثناء المتابعة.';

      // نقل الخريطة إلى الموقع أول مرة فقط
      if (startButton().disabled && !map._locationCentered) {
        map.setView(point, 17);
        map._locationCentered = true;
      }
    }

    document.getElementById('startLocation').addEventListener(
      'click',
      function () {
        if (!navigator.geolocation) {
          status().textContent =
            'المتصفح لا يدعم تحديد الموقع.';
          return;
        }

        if (watchId !== null) return;

        bestAccuracy = Infinity;
        map._locationCentered = false;

        startButton().disabled = true;
        startButton().textContent = 'جارٍ تحديد الموقع...';
        stopButton().disabled = false;

        status().textContent =
          'جارٍ الحصول على الموقع. قد يستغرق ذلك بعض الوقت...';

        watchId = navigator.geolocation.watchPosition(
          function (position) {
            updateLocation(position);
          },

          function (error) {
            let message = 'تعذر تحديث الموقع. حاول مرة أخرى.';

            if (error.code === 1) {
              message =
                'إذن الموقع مرفوض. اسمح للمتصفح باستخدام موقعك.';
            } else if (error.code === 2) {
              message =
                'الموقع غير متاح حاليًا. تحقق من إعدادات الموقع.';
            } else if (error.code === 3) {
              message =
                'تأخر الحصول على الموقع. انتظر قليلًا أو حاول مجددًا.';
            }

            status().textContent = message;
          },

          {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 30000
          }
        );
      }
    );

    document.getElementById('stopLocation').addEventListener(
      'click',
      function () {
        stopTracking();
        status().innerHTML += '<br>تم إيقاف متابعة الموقع.';
      }
    );
  </script>
</body>
</html>
