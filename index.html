<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>بيش ↔️ جازان</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* لوحة الأزرار */

    .top-panel {
      position: fixed;

      top: 12px;
      right: 12px;
      left: 12px;

      z-index: 1000;

      display: flex;
      gap: 8px;

      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 12px;

      padding: 12px 15px;

      font-size: 15px;
      font-weight: bold;

      background: white;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.20);

      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    /* معلومات الموقع */

    .status {
      position: fixed;

      bottom: 15px;
      right: 15px;
      left: 15px;

      z-index: 1000;

      background: rgba(255, 255, 255, 0.94);

      border-radius: 15px;

      padding: 12px;

      text-align: center;

      box-shadow:
        0 3px 15px rgba(0, 0, 0, 0.20);

      font-size: 14px;
    }

    /* حاوية سهم الاتجاه */

    .direction-arrow-container {
      width: 40px;
      height: 40px;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    /* سهم البوصلة */

    .direction-arrow-svg {
      width: 32px;
      height: 32px;

      display: block;

      overflow: visible;
    }

    /* صندوق الاتجاه */

    .direction-box {
      position: fixed;

      top: 125px;
      left: 15px;

      z-index: 1000;

      background: rgba(255, 255, 255, 0.95);

      border-radius: 14px;

      padding: 10px 14px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.20);

      text-align: center;

      min-width: 90px;
    }

    .direction-degree {
      font-size: 18px;
      font-weight: bold;
    }

    .direction-name {
      font-size: 13px;
      margin-top: 3px;
    }

    .leaflet-control-attribution {
      font-size: 9px;
    }

  </style>

</head>


<body>


  <div class="top-panel">

    <button onclick="startTracking()">
      🔵 موقعي
    </button>

    <button onclick="addManualPin()">
      📌 إضافة دبوس
    </button>

    <button onclick="enableAlerts()">
      🔔 تشغيل التنبيهات
    </button>

  </div>


  <div class="direction-box">

    <div
      class="direction-degree"
      id="directionDegree"
    >
      --°
    </div>

    <div
      class="direction-name"
      id="directionName"
    >
      الاتجاه غير معروف
    </div>

  </div>


  <div id="map"></div>


  <div
    class="status"
    id="status"
  >
    جاهز — اضغط «موقعي» لبدء التتبع
  </div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <script>

    const map =
      L.map('map').setView(
        [17.15, 42.56],
        9
      );


    const normalMap =
      L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
          maxZoom: 19,

          attribution:
            '&copy; OpenStreetMap contributors'
        }
      );


    normalMap.addTo(map);


    L.control.layers(
      {
        "الخريطة العادية": normalMap
      },

      null,

      {
        position: 'topright'
      }
    ).addTo(map);


    let watchId = null;

    let userMarker = null;

    let accuracyCircle = null;

    let directionMarker = null;

    let currentHeading = null;

    let alertsEnabled = false;


    function updateStatus(text) {

      document.getElementById(
        'status'
      ).textContent = text;

    }


    function getDirectionName(degrees) {

      if (
        degrees >= 337.5 ||
        degrees < 22.5
      ) {
        return 'شمال';
      }

      if (degrees < 67.5) {
        return 'شمال شرقي';
      }

      if (degrees < 112.5) {
        return 'شرق';
      }

      if (degrees < 157.5) {
        return 'جنوب شرقي';
      }

      if (degrees < 202.5) {
        return 'جنوب';
      }

      if (degrees < 247.5) {
        return 'جنوب غربي';
      }

      if (degrees < 292.5) {
        return 'غرب';
      }

      return 'شمال غربي';

    }


    /*
      هذه الدالة هي المسؤولة عن:
      1- الرقم
      2- اسم الاتجاه
      3- تدوير السهم
    */

    function updateDirection(degrees) {

      if (!Number.isFinite(degrees)) {
        return;
      }


      degrees =
        (degrees + 360) % 360;


      currentHeading = degrees;


      document.getElementById(
        'directionDegree'
      ).textContent =
        Math.round(degrees) + '°';


      document.getElementById(
        'directionName'
      ).textContent =
        getDirectionName(degrees);


      /*
        هنا النقطة المهمة:

        نحن لا نستخدم transform على عنصر Leaflet.

        نحن ندور polygon داخل SVG فقط.
      */

      if (directionMarker) {

        const markerElement =
          directionMarker.getElement();


        if (markerElement) {

          const arrow =
            markerElement.querySelector(
              '.direction-arrow-svg'
            );


          if (arrow) {

            const polygon =
              arrow.querySelector(
                '.direction-arrow-shape'
              );


            if (polygon) {

              polygon.setAttribute(
                'transform',
                'rotate(' +
                  degrees +
                  ' 20 20)'
              );

            }

          }

        }

      }


      updateStatus(
        '🔵 التتبع يعمل — ' +
        getDirectionName(degrees) +
        ' — ' +
        Math.round(degrees) +
        '°'
      );

    }


    function startTracking() {

      if (!navigator.geolocation) {

        updateStatus(
          '❌ جهازك لا يدعم تحديد الموقع'
        );

        return;
      }


      if (watchId !== null) {

        updateStatus(
          '🔵 التتبع يعمل بالفعل'
        );

        startCompass();

        return;
      }


      updateStatus(
        '⏳ جاري تحديد موقعك...'
      );


      startCompass();


      watchId =
        navigator.geolocation.watchPosition(

          function(position) {

            const lat =
              position.coords.latitude;

            const lng =
              position.coords.longitude;

            const accuracy =
              position.coords.accuracy;


            const userLocation =
              [lat, lng];


            /*
              إنشاء علامة المستخدم
            */

            if (!userMarker) {

              userMarker =
                L.marker(
                  userLocation,
                  {

                    icon:
                      L.divIcon(
                        {

                          className: '',

                          html:
                            '<div class="user-dot"></div>',

                          iconSize:
                            [20, 20],

                          iconAnchor:
                            [10, 10]

                        }
                      )

                  }
                ).addTo(map);


              map.setView(
                userLocation,
                16
              );


              /*
                إنشاء سهم الاتجاه

                لاحظ:
                Leaflet يتحكم في الحاوية الخارجية فقط.

                SVG الداخلي هو الذي يدور.
              */

              directionMarker =
                L.marker(
                  userLocation,
                  {

                    icon:
                      L.divIcon(
                        {

                          className: '',

                          html:

                            '<div class="direction-arrow-container">' +

                              '<svg ' +
                                'class="direction-arrow-svg" ' +
                                'viewBox="0 0 40 40" ' +
                                'aria-hidden="true"' +
                              '>' +

                                '<polygon ' +

                                  'class="direction-arrow-shape" ' +

                                  'points="20,2 35,35 20,27 5,35" ' +

                                  'fill="#1976ff" ' +

                                  'stroke="white" ' +

                                  'stroke-width="1.5" ' +

                                  'stroke-linejoin="round"' +

                                '></polygon>' +

                              '</svg>' +

                            '</div>',

                          iconSize:
                            [40, 40],

                          iconAnchor:
                            [20, 20]

                        }
                      ),

                    zIndexOffset:
                      1000

                  }
                ).addTo(map);


              /*
                إذا كانت البوصلة أعطتنا اتجاهًا
                قبل إنشاء السهم، نطبقه مباشرة.
              */

              if (
                currentHeading !== null
              ) {

                updateDirection(
                  currentHeading
                );

              }

            }

            else {

              userMarker.setLatLng(
                userLocation
              );

              directionMarker.setLatLng(
                userLocation
              );

            }


            /*
              دائرة دقة GPS
            */

            if (!accuracyCircle) {

              accuracyCircle =
                L.circle(
                  userLocation,
                  {

                    radius:
                      accuracy,

                    color:
                      '#1976ff',

                    fillColor:
                      '#1976ff',

                    fillOpacity:
                      0.08,

                    weight:
                      1

                  }
                ).addTo(map);

            }

            else {

              accuracyCircle.setLatLng(
                userLocation
              );

              accuracyCircle.setRadius(
                accuracy
              );

            }


            map.panTo(
              userLocation,
              {
                animate: true,
                duration: 0.5
              }
            );


            /*
              إذا لم تصل البوصلة بعد،
              نوضح ذلك فقط.
            */

            if (
              currentHeading === null
            ) {

              updateStatus(
                '🔵 التتبع يعمل — بانتظار البوصلة — دقة GPS: ' +
                Math.round(accuracy) +
                ' م'
              );

            }

          },


          function(error) {

            let message =
              '❌ تعذر تحديد الموقع';


            if (error.code === 1) {

              message =
                '❌ اسمح للموقع من إعدادات الآيفون';

            }


            if (error.code === 2) {

              message =
                '❌ تعذر الحصول على موقعك';

            }


            if (error.code === 3) {

              message =
                '❌ انتهت مهلة تحديد الموقع';

            }


            updateStatus(
              message
            );

          },


          {

            enableHighAccuracy:
              true,

            maximumAge:
              1000,

            timeout:
              15000

          }

        );

    }


    /*
      تشغيل البوصلة
    */

    function startCompass() {

      if (

        typeof DeviceOrientationEvent !==
          'undefined'

        &&

        typeof DeviceOrientationEvent
          .requestPermission ===
          'function'

      ) {


        DeviceOrientationEvent
          .requestPermission()

          .then(
            function(permission) {

              if (
                permission === 'granted'
              ) {

                window.addEventListener(
                  'deviceorientation',
                  handleOrientation,
                  true
                );

              }

              else {

                updateStatus(
                  '❌ لم يتم السماح باستخدام البوصلة'
                );

              }

            }
          )

          .catch(
            function(error) {

              console.log(
                'Compass permission error:',
                error
              );

              updateStatus(
                '❌ تعذر تشغيل البوصلة'
              );

            }
          );

      }

      else {

        window.addEventListener(
          'deviceorientation',
          handleOrientation,
          true
        );

      }

    }


    /*
      قراءة بوصلة الآيفون

      0   = شمال
      90  = شرق
      180 = جنوب
      270 = غرب
    */

    function handleOrientation(event) {

      let heading = null;


      if (

        typeof event.webkitCompassHeading ===
          'number'

        &&

        Number.isFinite(
          event.webkitCompassHeading
        )

      ) {

        heading =
          event.webkitCompassHeading;

      }

      else if (

        typeof event.alpha ===
          'number'

        &&

        Number.isFinite(
          event.alpha
        )

      ) {

        heading =
          360 - event.alpha;

      }


      if (heading === null) {

        return;

      }


      updateDirection(
        heading
      );

    }


    function addManualPin() {

      updateStatus(
        '📌 اضغط على أي مكان في الخريطة لإضافة دبوس'
      );


      map.once(
        'click',
        function(event) {

          const marker =
            L.marker(
              event.latlng
            ).addTo(map);


          marker
            .bindPopup(
              '📌 موقع مسجل'
            )
            .openPopup();


          updateStatus(
            '✅ تمت إضافة الدبوس'
          );

        }
      );

    }


    function enableAlerts() {

      alertsEnabled = true;


      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;


        const audioContext =
          new AudioContext();


        const oscillator =
          audioContext.createOscillator();


        const gain =
          audioContext.createGain();


        oscillator.connect(
          gain
        );


        gain.connect(
          audioContext.destination
        );


        oscillator.frequency.value =
          880;


        gain.gain.value =
          0.08;


        oscillator.start();


        setTimeout(
          function() {

            oscillator.stop();

          },
          150
        );


        updateStatus(
          '🔔 تم تشغيل التنبيهات'
        );

      }

      catch (error) {

        updateStatus(
          '🔔 تم تفعيل التنبيهات'
        );

      }

    }

  </script>

</body>

</html>
