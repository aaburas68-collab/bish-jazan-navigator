<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>بيش ↔ جازان</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .top-panel {
      position: fixed;
      top: 12px;
      right: 12px;
      left: 12px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 15px;
      font-size: 15px;
      font-weight: bold;
      background: white;
      box-shadow: 0 3px 12px rgba(0,0,0,0.20);
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    .status {
      position: fixed;
      bottom: 15px;
      right: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(255,255,255,0.94);
      border-radius: 15px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.20);
      font-size: 14px;
    }

    .leaflet-control-attribution {
      font-size: 9px;
    }
  </style>
</head>

<body>

  <div class="top-panel">
    <button onclick="startTracking()">🔵 موقعي</button>
    <button onclick="addManualPin()">📌 إضافة دبوس</button>
    <button onclick="enableAlerts()">🔔 تشغيل التنبيهات</button>
  </div>

  <div id="map"></div>

  <div class="status" id="status">
    جاهز — اضغط «موقعي» لبدء تحديد موقعك
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    /*
      ==================================================
      مشروع بيش ↔ جازان
      الإصدار الأساسي
      ==================================================

      سيتم لاحقًا إضافة:
      - الاتجاه 🧭
      - التتبع المستمر 🔵
      - الدبابيس 📌
      - التنبيهات 🔔
      - الاهتزاز 📳
      - ETA ⏱️
      - قاعدة البيانات ☁️
    */

    const map = L.map('map').setView([17.15, 42.56], 9);

    // الخريطة العادية
    const normalMap = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    );

    normalMap.addTo(map);

    // هنا سنضيف لاحقًا:
    // Satellite
    // Terrain

    const layers = {
      "الخريطة العادية": normalMap
    };

    L.control.layers(layers, null, {
      position: 'topright'
    }).addTo(map);


    let userMarker = null;
    let accuracyCircle = null;
    let watchId = null;
    let alertsEnabled = false;


    function updateStatus(text) {
      document.getElementById('status').textContent = text;
    }


    function startTracking() {

      if (!navigator.geolocation) {
        updateStatus('❌ جهازك لا يدعم تحديد الموقع');
        return;
      }

      if (watchId !== null) {
        updateStatus('🔵 التتبع يعمل بالفعل');
        return;
      }

      updateStatus('⏳ جاري تحديد موقعك...');

      watchId = navigator.geolocation.watchPosition(

        function(position) {

          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          const userLocation = [lat, lng];

          if (!userMarker) {

            userMarker = L.circleMarker(userLocation, {
              radius: 9,
              color: '#ffffff',
              weight: 3,
              fillColor: '#1976ff',
              fillOpacity: 1
            }).addTo(map);

            map.setView(userLocation, 16);

          } else {

            userMarker.setLatLng(userLocation);

          }

          if (!accuracyCircle) {

            accuracyCircle = L.circle(userLocation, {
              radius: accuracy,
              color: '#1976ff',
              fillOpacity: 0.08,
              weight: 1
            }).addTo(map);

          } else {

            accuracyCircle.setLatLng(userLocation);
            accuracyCircle.setRadius(accuracy);

          }

          updateStatus(
            '🔵 موقعك يعمل — الدقة التقريبية: ' +
            Math.round(accuracy) +
            ' متر'
          );

        },

        function(error) {

          let message = '❌ تعذر تحديد الموقع';

          if (error.code === 1) {
            message = '❌ اسمح للموقع من إعدادات المتصفح';
          }

          if (error.code === 2) {
            message = '❌ تعذر الحصول على موقعك';
          }

          if (error.code === 3) {
            message = '❌ انتهت مهلة تحديد الموقع';
          }

          updateStatus(message);

        },

        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 15000
        }

      );
    }


    function addManualPin() {

      updateStatus(
        '📌 اضغط على أي مكان في الخريطة لإضافة دبوس'
      );

      map.once('click', function(event) {

        const marker = L.marker(event.latlng).addTo(map);

        marker.bindPopup(
          '📌 موقع مسجل'
        ).openPopup();

        updateStatus(
          '✅ تمت إضافة الدبوس'
        );

      });

    }


    function enableAlerts() {

      alertsEnabled = true;

      // هذا الصوت البسيط هدفه تفعيل الصوت بعد تفاعل المستخدم.
      const audioContext =
        new (window.AudioContext || window.webkitAudioContext)();

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.frequency.value = 880;
      gain.gain.value = 0.08;

      oscillator.start();

      setTimeout(function() {
        oscillator.stop();
      }, 150);

      updateStatus(
        '🔔 تم تشغيل نظام التنبيهات'
      );
    }

  </script>

</body>
</html>
